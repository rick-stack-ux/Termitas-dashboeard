<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Panel Sondas T</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#FFFFFF;
  --card:#2ECC0F;
  --text:#FFFFFF;
  --muted:rgba(255,255,255,0.75);
  --shadow:0 8px 20px rgba(0,0,0,0.35);
}

/* ===== NUEVO MENU CUADRO ===== */
.menu-btn{
  position:fixed;
  top:15px;
  right:15px;
  font-size:22px;
  background:var(--card);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
  z-index:1001;
  box-shadow:var(--shadow);
}

.menu-box{
  position:fixed;
  top:60px;
  right:15px;
  width:280px;
  background:var(--card);
  border-radius:12px;
  box-shadow:var(--shadow);
  padding:12px;
  display:none;
  z-index:1002;
}

.menu-box.active{
  display:block;
}

.menu-section{
  margin-bottom:12px;
  padding:10px;
  background:rgba(0,0,0,0.25);
  border-radius:10px;
}

.menu-section h3{
  margin:0 0 6px 0;
  font-size:14px;
}

.menu-section p{
  margin:0;
  font-size:13px;
  color:var(--muted);
}

/* ===== RESTO ORIGINAL ===== */
html,body{
  margin:0;
  padding:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100%;
}

.app{max-width:1200px;margin:18px auto;padding:14px;}

.header-logo{
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}
.header-logo img{height:150px;}

.header{text-align:center;margin-bottom:16px;}
.title h1{margin:0;font-size:20px;}
.title p{margin:0;color:var(--muted);font-size:13px;}

.summary{
  display:flex;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
  justify-content:center;
}
.metric{
  background:var(--card);
  padding:12px 14px;
  border-radius:10px;
  box-shadow:var(--shadow);
  min-width:140px;
  text-align:center;
}
.metric small{display:block;color:var(--muted);font-size:12px;}
.metric b{display:block;font-size:18px;margin-top:6px;}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:14px;
  box-shadow:var(--shadow);
}

/* (TODO TU CSS RESTANTE IGUAL) */
</style>

</head>

<body>

<button class="menu-btn" onclick="toggleMenu()">☰</button>

<div class="menu-box" id="menuBox">

  <div class="menu-section">
    <h3>📊 Historial Sonda</h3>
    <p>Gráfico basado en fecha y hora de la sonda</p>
  </div>

  <div class="menu-section">
    <h3>❓ Ayuda</h3>
    <p>
      🌡 Temperatura: mide el calor<br>
      💧 Humedad: porcentaje<br>
      📏 Distancia: detección principal
    </p>
  </div>

  <div class="menu-section">
    <h3>📧 Soporte</h3>
    <p id="correoSoporte">correo@editar.cl</p>
  </div>

</div>

<div class="app">

  <div class="header-logo">
    <img src="logo.png">
  </div>

  <div class="header">
    <div class="title">
      <h1>Panel Sondas T</h1>
      <p>Monitoreo: Temperatura · Humedad · Distancia</p>
    </div>
  </div>

  <div class="summary">
    <div class="metric"><small>Sondas activas</small><b id="numActivas">0</b></div>
  </div>

  <div id="grid"></div>

</div>

<script>
function toggleMenu(){
  document.getElementById("menuBox").classList.toggle("active");
}
</script>

<!-- 🔥 TU SCRIPT ORIGINAL SIGUE IGUAL ABAJO -->

</body>
</html>
