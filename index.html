<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Panel Sondas T</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#FFFFFF;
  --card:#2ECC0F;
  --text:#FFFFFF;
  --muted:rgba(255,255,255,0.75);
  --shadow:0 8px 20px rgba(0,0,0,0.35);
}

/* BOTON */
.menu-btn{
  position:fixed;
  top:15px;
  right:15px;
  font-size:22px;
  background:#2ECC0F;
  color:#fff;
  border:none;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
  z-index:1001;
  box-shadow:var(--shadow);
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:0;
  right:-350px;
  width:330px;
  height:100%;
  background:#ffffff;
  color:#333;
  box-shadow:-5px 0 25px rgba(0,0,0,0.3);
  padding:20px;
  transition:0.3s ease;
  z-index:1002;
}
.sidebar.active{ right:0; }

.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  opacity:0;
  visibility:hidden;
  transition:0.3s;
  z-index:1000;
}
.overlay.active{
  opacity:1;
  visibility:visible;
}

#chartContainer{
  background:#fff;
  border-radius:10px;
  padding:10px;
}

/* RESTO ORIGINAL */
html,body{
  margin:0;
  padding:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.app{max-width:1200px;margin:18px auto;padding:14px;}
.header-logo{display:flex;justify-content:center;margin-bottom:12px;}
.header-logo img{height:150px;}
.header{text-align:center;margin-bottom:16px;}
.title h1{margin:0;font-size:20px;}
.title p{margin:0;color:var(--muted);font-size:13px;}

.summary{
  display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;justify-content:center;
}
.metric{
  background:var(--card);
  padding:12px 14px;
  border-radius:10px;
  box-shadow:var(--shadow);
  min-width:140px;
  text-align:center;
}
.metric small{display:block;color:var(--muted);font-size:12px;}
.metric b{display:block;font-size:18px;margin-top:6px;}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:14px;
  box-shadow:var(--shadow);
}

.note{
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}
</style>

</head>

<body>

<button class="menu-btn" onclick="toggleMenu()">☰</button>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="sidebar" id="sidebar">
  <h2>Comportamiento de la Sonda</h2>
  <div id="chartContainer">
    <canvas id="graficoMes"></canvas>
  </div>

  <h3 style="margin-top:20px;">📧 Soporte</h3>
  <p>soporte@tudominio.cl</p>
</div>

<div class="app">

  <div class="header-logo">
    <img src="logo.png" alt="logo">
  </div>

  <div class="header">
    <div class="title">
      <h1>Panel Sondas T</h1>
      <p>Monitoreo: Temperatura · Humedad · Distancia</p>
    </div>
  </div>

  <div class="summary">
    <div class="metric"><small>Sondas activas</small><b id="numActivas">0</b></div>
    <div class="metric"><small>Alertas</small><b id="numAlertas">0</b></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="note">Alerta distancia > 40 mm</div>

</div>

<script>
function toggleMenu(){
  sidebar.classList.toggle("active");
  overlay.classList.toggle("active");
}

/* ===== HISTORIAL NIVEL INGENIERO ===== */

const datosPorDia = {};
const LIMITE_ALERTA = 40;

function procesarDato(d){
  if(!d || !d.FechaHora) return;

  const fecha = d.FechaHora.split(" ")[0].split("/");
  const dia = parseInt(fecha[0]);

  if(!datosPorDia[dia]){
    datosPorDia[dia]={temp:[],hum:[],dist:[]};
  }

  datosPorDia[dia].temp.push(Number(d.Temperatura_C||0));
  datosPorDia[dia].hum.push(Number(d.Humedad_pct||0));
  datosPorDia[dia].dist.push(Number(d.Distancia_mm||0));
}

function calcularProm(){
  let dias=[],t=[],h=[],d=[];
  for(let i=1;i<=31;i++){
    dias.push(i);
    if(datosPorDia[i]){
      const obj=datosPorDia[i];
      t.push(avg(obj.temp));
      h.push(avg(obj.hum));
      d.push(avg(obj.dist));
    }else{
      t.push(null);h.push(null);d.push(null);
    }
  }
  return {dias,t,h,d};
}

function avg(arr){
  return Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
}

const chart = new Chart(document.getElementById("graficoMes"),{
  type:"line",
  data:{
    labels:[],
    datasets:[
      {
        label:"📏 Distancia (mm)",
        data:[],
        borderWidth:3,
        tension:0.3
      },
      {
        label:"🌡 Temp",
        data:[],
        borderWidth:1
      },
      {
        label:"💧 Hum",
        data:[],
        borderWidth:1
      },
      {
        label:"🚨 Límite",
        data:Array(31).fill(LIMITE_ALERTA),
        borderDash:[5,5]
      }
    ]
  }
});

/* FIREBASE ORIGINAL + HISTORIAL */

firebase.initializeApp({
  authDomain:"enlace-t.firebaseapp.com",
  databaseURL:"https://enlace-t-default-rtdb.firebaseio.com",
  projectId:"enlace-t"
});

firebase.database().ref("prueba").on("value",s=>{
  const d=s.val();
  procesarDato(d);

  const res=calcularProm();

  chart.data.labels=res.dias;
  chart.data.datasets[0].data=res.d;
  chart.data.datasets[1].data=res.t;
  chart.data.datasets[2].data=res.h;

  chart.update();
});
</script>

</body>
</html>
