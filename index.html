<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Panel Sondas T</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#FFFFFF;
  --card:#2ECC0F;
  --text:#FFFFFF;
  --muted:rgba(255,255,255,0.75);
  --accent:#39FF14;
  --danger:#ff3b3b;
  --shadow:0 8px 20px rgba(0,0,0,0.35);
}

html,body{
  margin:0;
  padding:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.app{max-width:1200px;margin:18px auto;padding:14px;}

.header-logo{display:flex;justify-content:center;margin-bottom:12px;}
.header-logo img{height:150px;}

.header{text-align:center;margin-bottom:16px;}

.summary{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;justify-content:center;}

.metric{background:var(--card);padding:12px;border-radius:10px;box-shadow:var(--shadow);min-width:140px;text-align:center;}

.grid{display:grid;grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));gap:16px;}

.card{background:var(--card);border-radius:12px;padding:14px;box-shadow:var(--shadow);}

.sonda-title{font-weight:600;}

.presenciaAlert{text-align:center;margin-top:8px;color:#ff8a8a;}
</style>

</head>

<body>
<div class="app">

<div class="header-logo">
<img src="logo.png">
</div>

<div class="header">
<h1>Panel Sondas T</h1>
<p>Monitoreo</p>
</div>

<div class="summary">
<div class="metric"><small>Sondas activas</small><b id="numActivas">0</b></div>
<div class="metric"><small>Alertas distancia</small><b id="numAlertas">0</b></div>
<div class="metric"><small>Temp promedio</small><b id="promTemp">--</b></div>
<div class="metric"><small>Hum promedio</small><b id="promHum">--</b></div>
</div>

<div id="grid" class="grid"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

// 🔥 SOLO AGREGADO
function estadoConexion(fechaStr){
  if(!fechaStr) return "OFFLINE";

  const p = fechaStr.split(" ");
  if(p.length < 2) return "OFFLINE";

  const f = p[0].split("/");
  const h = p[1].split(":");

  const fechaDato = new Date(f[2], f[1]-1, f[0], h[0], h[1], h[2]);
  const ahora = new Date();
  const diffMin = (ahora - fechaDato)/60000;

  return diffMin <= 5 ? "ONLINE" : "OFFLINE";
}

const NUM=5,DIST_THRESHOLD_MM=40;
const chartsT=[],chartsH=[],active=[true,false,false,false,false],
lastValues=Array(NUM).fill(null),badCount=Array(NUM).fill(0);

function createCard(i){
const grid=document.getElementById('grid');
const card=document.createElement('div');
card.className='card'; card.id=`card-${i+1}`;

card.innerHTML=`
<div style="display:flex;justify-content:space-between;align-items:flex-start;">
  <div class="sonda-title">Sonda ${i+1}</div>
  <div style="text-align:right;font-size:12px;">
    <div id="estado-${i+1}">🔴 OFFLINE</div>
    <div id="wifi-${i+1}">📶 --</div>
  </div>
</div>

<div>Dist: <span id="dist-${i+1}">--</span></div>
<div id="tempVal-${i+1}">--</div>
<div id="humVal-${i+1}">--</div>
`;

grid.appendChild(card);

const pres=document.createElement('div');
pres.id=`pres-${i+1}`;
card.appendChild(pres);

chartsT[i]=new Chart(document.createElement('canvas'),{type:'doughnut',data:{datasets:[{data:[0,100]}]}});
chartsH[i]=new Chart(document.createElement('canvas'),{type:'doughnut',data:{datasets:[{data:[0,100]}]}});
}

for(let i=0;i<NUM;i++)createCard(i);

firebase.initializeApp({
databaseURL:"https://enlace-t-default-rtdb.firebaseio.com"
});

firebase.database().ref("prueba").on("value",s=>{
const d=s.val()||{};
const estado=estadoConexion(d.FechaHora);

for(let i=0;i<NUM;i++){

if(i!==0){
document.getElementById(`estado-${i+1}`).textContent="🔴 OFFLINE";
document.getElementById(`wifi-${i+1}`).textContent="📶 --";
continue;
}

const t=Number(d.Temperatura_C||0);
const h=Number(d.Humedad_pct||0);
const dist=Number(d.Distancia_mm||0);

lastValues[i]={t,h,dist};

// alarma
if(dist> DIST_THRESHOLD_MM){badCount[i]++;}else{badCount[i]=0;}

if(badCount[i]>=3){
document.getElementById(`pres-${i+1}`).textContent="⚠️ TERMITA";
}else{
document.getElementById(`pres-${i+1}`).textContent="";
}

// valores
document.getElementById(`tempVal-${i+1}`).textContent=t+"°C";
document.getElementById(`humVal-${i+1}`).textContent=h+"%";
document.getElementById(`dist-${i+1}`).textContent=dist+"mm";

// estado
document.getElementById(`estado-${i+1}`).textContent=estado==="ONLINE"?"🟢 ONLINE":"🔴 OFFLINE";
document.getElementById(`wifi-${i+1}`).textContent=estado==="ONLINE"?"📶 Conectado":"📶 Sin señal";

// grafico
const tempMax=50;
const pct=Math.min((t/tempMax)*100,100);

chartsT[i].data.datasets[0].data=[pct,100-pct];
chartsH[i].data.datasets[0].data=[h,100-h];
}
});
</script>

</body>
</html>
