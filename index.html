<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Panel Sondas T</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#FFFFFF;
  --card:#2ECC0F;
  --text:#FFFFFF;
  --muted:rgba(255,255,255,0.75);
  --accent:#39FF14;
  --danger:#ff3b3b;
  --shadow:0 8px 20px rgba(0,0,0,0.35);
}

html,body{
  margin:0;
  padding:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100%;
}

.app{max-width:1200px;margin:18px auto;padding:14px;}

.header-logo{
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}
.header-logo img{height:150px;}

.header{text-align:center;margin-bottom:16px;}
.title h1{margin:0;font-size:20px;}
.title p{margin:0;color:var(--muted);font-size:13px;}

.summary{
  display:flex;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
  justify-content:center;
}
.metric{
  background:var(--card);
  padding:12px 14px;
  border-radius:10px;
  box-shadow:var(--shadow);
  min-width:140px;
  text-align:center;
}
.metric small{display:block;color:var(--muted);font-size:12px;}
.metric b{display:block;font-size:18px;margin-top:6px;}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:14px;
  box-shadow:var(--shadow);
  border:2px solid transparent;
}

/* 🔥 SOLO MEJORA ALERTA */
.card.alert{
  border-color:#ff0000 !important;
  box-shadow:0 0 15px rgba(255,0,0,0.7);
}

.card.inactive{opacity:.35;filter:grayscale(.1);}

.sonda-title{font-weight:600;font-size:15px;margin-bottom:8px;}
.tog{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:8px;}

.meter-box{
  background:#000020;
  border-radius:12px;
  padding:8px 6px 6px 6px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.08),
    0 6px 14px rgba(0,0,0,0.45);
  margin:6px 0 8px 0;
}

.charts{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  padding:6px 0;
}

canvas{width:110px!important;height:110px!important;}

.labels{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

.lbl{
  font-size:12px;
  color:rgba(255,255,255,0.85);
  text-align:center;
  min-width:95px;
}

.val{
  font-weight:700;
  font-size:15px;
  color:#ffffff;
}

/* 🔥 SOLO CAMBIO COLOR ALERTA */
.presenciaAlert{
  font-weight:700;
  text-align:center;
  padding:8px 6px;
  margin-top:8px;
  border-radius:8px;
  background:rgba(255,0,0,0.08);
  color:#ff0000;
  min-height:44px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.note{
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}
</style>

</head>

<body>
<div class="app">

  <div class="header-logo">
    <!-- Reemplaza con tu logo si lo tienes, o déjalo -->
    <img src="logo.png" alt="IguanaLab" onerror="this.style.display='none'">
  </div>

  <div class="header">
    <div class="title">
      <h1>Panel Sondas T</h1>
      <p>Monitoreo: Temperatura · Humedad · Distancia (mm)</p>
    </div>
  </div>

  <div class="summary">
    <div class="metric"><small>Sondas activas</small><b id="numActivas">0</b></div>
    <div class="metric"><small>Alertas distancia</small><b id="numAlertas">0</b></div>
    <div class="metric"><small>Temp. promedio</small><b id="promTemp">-- °C</b></div>
    <div class="metric"><small>Humedad promedio</small><b id="promHum">-- %</b></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="note">Umbral alerta distancia: <b>> 40 mm</b></div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

function estadoConexion(fechaStr){
  if(!fechaStr) return "OFFLINE";
  const p = fechaStr.split(" ");
  if(p.length < 2) return "OFFLINE";
  const f = p[0].split("/");
  const h = p[1].split(":");
  const fechaDato = new Date(f[2], f[1]-1, f[0], h[0], h[1], h[2]);
  const ahora = new Date();
  const diffMin = (ahora - fechaDato)/60000;
  return diffMin <= 780 ? "ONLINE" : "OFFLINE";
}

const NUM = 5, DIST_THRESHOLD_MM = 40;
const chartsT = [], chartsH = [], active = [true,false,false,false,false],
      lastValues = Array(NUM).fill(null), badCount = Array(NUM).fill(0);

function tempColor(v){
  return v <= 22 ? 'rgba(46,204,113,0.85)' :
         v <= 28 ? 'rgba(241,196,15,0.85)' :
         'rgba(231,76,60,0.9)';
}

function humColor(v){
  return v <= 30 ? 'rgba(52,152,219,0.85)' :
         v <= 60 ? 'rgba(41,128,185,0.9)' :
         'rgba(31,97,141,0.95)';
}

function createCard(i){
  const grid=document.getElementById('grid');
  const card=document.createElement('div');
  card.className='card'; card.id=`card-${i+1}`;
  if(!active[i]) card.classList.add('inactive');

  card.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div class="sonda-title">Sonda ${i+1}</div>
      <div style="text-align:right;font-size:12px;">
        <div id="estado-${i+1}">🔴 OFFLINE</div>
        <div id="wifi-${i+1}">📶 --</div>
      </div>
    </div>

    <div class="tog">
      <label><input type="checkbox" id="toggle-${i+1}" ${active[i]?'checked':''}> Activar</label>
      <div style="flex:1"></div>
      <div style="font-size:12px;color:var(--muted)">Dist: <span id="dist-${i+1}">--</span></div>
    </div>

    <div class="meter-box">
      <div class="charts">
        <canvas id="t-${i+1}"></canvas>
        <canvas id="h-${i+1}"></canvas>
      </div>
      <div class="labels">
        <div class="lbl">Temperatura<div class="val" id="tempVal-${i+1}">-- °C</div></div>
        <div class="lbl">Humedad<div class="val" id="humVal-${i+1}">-- %</div></div>
      </div>
    </div>
  `;
  grid.appendChild(card);

  const pres=document.createElement('div');
  pres.className='presenciaAlert'; pres.id=`pres-${i+1}`;
  card.appendChild(pres);

  card.querySelector(`#toggle-${i+1}`).addEventListener('change',e=>{
    active[i]=e.target.checked;
    card.classList.toggle('inactive',!active[i]);
    updateSummary();
  });

  chartsT[i]=new Chart(document.getElementById(`t-${i+1}`),{
    type:'doughnut',
    data:{datasets:[{data:[0,100],backgroundColor:[tempColor(0),'rgba(0,0,0,0.35)'],borderWidth:0}]},
    options:{rotation:-90,circumference:180,cutout:'72%',plugins:{legend:{display:false}}}
  });

  chartsH[i]=new Chart(document.getElementById(`h-${i+1}`),{
    type:'doughnut',
    data:{datasets:[{data:[0,100],backgroundColor:[humColor(0),'rgba(0,0,0,0.35)'],borderWidth:0}]},
    options:{rotation:-90,circumference:180,cutout:'72%',plugins:{legend:{display:false}}}
  });
}

function updateSummary(){
  let act=0,alerts=0,sumT=0,sumH=0,count=0;
  for(let i=0;i<NUM;i++){
    if(!active[i]) continue;
    act++;
    if(!lastValues[i]) continue;
    sumT+=lastValues[i].t;
    sumH+=lastValues[i].h;
    count++;
    if(lastValues[i].dist>DIST_THRESHOLD_MM) alerts++;
  }
  numActivas.textContent=act;
  numAlertas.textContent=alerts;
  promTemp.textContent=(count?Math.round(sumT/count):'--')+' °C';
  promHum.textContent=(count?Math.round(sumH/count):'--')+' %';
}

for(let i=0;i<NUM;i++) createCard(i);
updateSummary();

firebase.initializeApp({
  authDomain: "enlace-t.firebaseapp.com",
  databaseURL: "https://enlace-t-default-rtdb.firebaseio.com",
  projectId: "enlace-t"
});

firebase.database().ref("prueba").on("value",s=>{
  const d=s.val()||{};
  const estado = estadoConexion(d.FechaHora);

  for(let i=0;i<NUM;i++){
    if(!active[i]) continue;

    if(i!==0){
      document.getElementById(`estado-${i+1}`).textContent="🔴 OFFLINE";
      document.getElementById(`wifi-${i+1}`).textContent="📶 --";
      document.getElementById(`tempVal-${i+1}`).textContent="-- °C";
      document.getElementById(`humVal-${i+1}`).textContent="-- %";
      document.getElementById(`dist-${i+1}`).textContent="--";
      document.getElementById(`pres-${i+1}`).textContent="";
      continue;
    }

    const t=Number(d.Temperatura_C||0);
    const h=Number(d.Humedad_pct||0);
    const dist=Number(d.Distancia_mm||0);
    lastValues[i]={t,h,dist};

    if(dist > DIST_THRESHOLD_MM){
      badCount[i]++;
    }else{
      badCount[i]=0;
    }

    const presEl = document.getElementById(`pres-${i+1}`);
    const cardEl = document.getElementById(`card-${i+1}`);

    if(badCount[i]>=3){
      presEl.textContent = "🚨 POSIBLE TERMITA";
      cardEl.classList.add("alert");
    }else{
      presEl.textContent = "";
      cardEl.classList.remove("alert");
    }

    document.getElementById(`tempVal-${i+1}`).textContent=`${t} °C`;
    document.getElementById(`humVal-${i+1}`).textContent=`${h} %`;
    document.getElementById(`dist-${i+1}`).textContent=`${Math.round(dist)} mm`;

    document.getElementById(`estado-${i+1}`).textContent = estado==="ONLINE"?"🟢 ONLINE":"🔴 OFFLINE";
    document.getElementById(`wifi-${i+1}`).textContent = estado==="ONLINE"?"📶 Conectado":"📶 Sin señal";

    const tempMax=50;
    const pct=Math.min((t/tempMax)*100,100);

    chartsT[i].data.datasets[0].data=[pct,100-pct];
    chartsT[i].data.datasets[0].backgroundColor[0]=tempColor(t);
    chartsT[i].update();

    chartsH[i].data.datasets[0].data=[h,100-h];
    chartsH[i].data.datasets[0].backgroundColor[0]=humColor(h);
    chartsH[i].update();
  }

  updateSummary();
});
</script>

<!-- ===== SISTEMA PRO MEJORADO ===== -->

<style>
.btn-pro{position:fixed;top:15px;right:15px;background:var(--accent);border:none;border-radius:10px;padding:8px;cursor:pointer;z-index:9999;box-shadow:var(--shadow);}
.btn-pro span{display:block;width:22px;height:3px;background:#000;margin:4px 0;}
.menu-pro{position:fixed;top:60px;right:15px;width:260px;background:rgba(46,204,15,0.98);border-radius:14px;padding:12px;display:none;z-index:9999;box-shadow:var(--shadow);}
.menu-pro.active{display:block;}
.menu-pro div{padding:10px;cursor:pointer;font-weight:600;border-bottom:1px solid rgba(255,255,255,0.1);}
.menu-pro div:last-child{border-bottom:none;}
.menu-pro div:hover{background:rgba(255,255,255,0.1);border-radius:8px;}

/* Panel ampliado para soportar el nuevo diseño de gráfico */
.panel-pro{position:fixed;top:100px;right:15px;width:auto;min-width:480px;max-width:90vw;background:rgba(46,204,15,0.98);border-radius:16px;padding:20px;display:none;z-index:9999;box-shadow:var(--shadow);}
.panel-pro.active{display:block;}
@media (max-width: 600px) {
  .panel-pro { min-width: 90vw; }
}
</style>

<button class="btn-pro" id="btnMenuPro">
  <span></span><span></span><span></span>
</button>

<div id="menuPro" class="menu-pro">
  <div onclick="abrirMenuPro('historial')">📊 Historial de Cebo</div>
  <div onclick="descargarCSV()">⬇ Descargar CSV</div>
  <div onclick="abrirMenuPro('ayuda')">❓ Ayuda</div>
</div>

<div id="panelPro" class="panel-pro"></div>

<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

<script>
btnMenuPro.onclick=()=>menuPro.classList.toggle("active");

document.addEventListener("click",(e)=>{
  if(!menuPro.contains(e.target)&&!btnMenuPro.contains(e.target)&&!panelPro.contains(e.target)){
    menuPro.classList.remove("active");
    panelPro.classList.remove("active");
  }
});

// Convertir fecha string a objeto Date para calcular la semana
function parseFechaCL(fechaStr) {
  if(!fechaStr) return new Date();
  const p = fechaStr.split(" ");
  if(p.length < 2) return new Date();
  const f = p[0].split("/");
  const h = p[1].split(":");
  return new Date(f[2], f[1]-1, f[0], h[0], h[1], h[2]);
}

function abrirMenuPro(tipo){
  panelPro.classList.add("active");

  if(tipo==="historial"){
    // Plantilla visual mejorada con Flexbox (Grafico Izquierda, Datos Derecha)
    panelPro.innerHTML=`
      <div style="display:flex; flex-direction:column; gap:10px;">
        <h3 style="margin:0; color:#fff; font-size:18px;">Movimiento del Cebo (Últimos 7 días)</h3>
        <div style="display:flex; flex-wrap:wrap; background:rgba(0,0,0,0.25); padding:20px; border-radius:12px; border:1px solid rgba(255,255,255,0.15);">
          
          <!-- Contenedor del Gráfico (Flexible) -->
          <div style="flex: 1 1 250px; border-right: 1px solid rgba(255,255,255,0.15); padding-right: 20px; min-width:0;">
            <canvas id="graficoHistorial" style="height:160px; width:100%;"></canvas>
          </div>

          <!-- Contenedor de Estadísticas (Fijo) -->
          <div style="min-width: 140px; text-align: center; display: flex; flex-direction: column; justify-content: center; padding-left: 20px;">
            <h1 id="distanciaActual" style="margin: 0; font-size: 38px; color: #fff;">-- <span style="font-size: 14px; color: rgba(255,255,255,0.7);">mm</span></h1>
            <p style="margin: 5px 0; color: rgba(255,255,255,0.7); font-size: 13px;">Distancia Actual</p>
            <p id="porcentajeCebo" style="font-weight: bold; margin: 0; font-size: 14px;">--</p>
          </div>

        </div>
      </div>
    `;

    const records = [];
    firebase.database().ref("historial").once("value",snap=>{
      snap.forEach(c=>{
        const d=c.val();
        if(d.FechaHora) {
          records.push({
            time: parseFechaCL(d.FechaHora),
            label: d.FechaHora,
            val: Number(d.Distancia_mm||0)
          });
        }
      });

      // Ordenar por tiempo (por si acaso Firebase los trae desordenados)
      records.sort((a,b) => a.time - b.time);

      const labels = records.map(r => r.label);
      const data = records.map(r => r.val);

      // Calcular lógica del porcentaje vs hace 7 días
      if (records.length > 0) {
        const currentVal = records[records.length - 1].val;
        const currentTime = records[records.length - 1].time;
        
        let baselineRecord = records[0]; 
        const sieteDiasEnMilisegundos = 7 * 24 * 60 * 60 * 1000;
        
        // Buscar el registro más cercano a 7 días atrás
        for (let i = records.length - 1; i >= 0; i--) {
          if (currentTime - records[i].time <= sieteDiasEnMilisegundos) {
            baselineRecord = records[i];
          } else {
            break; 
          }
        }
        
        const baselineVal = baselineRecord.val;
        let diferencia = currentVal - baselineVal;
        let porcentaje = baselineVal === 0 ? 0 : (diferencia / baselineVal) * 100;
        
        // Formato visual de la flecha y color
        let colorText = diferencia >= 0 ? "#39FF14" : "#ff3b3b";
        let arrow = diferencia >= 0 ? "▲" : "▼";
        
        document.getElementById('distanciaActual').innerHTML = `${currentVal.toFixed(1)} <span style="font-size: 14px; color: rgba(255,255,255,0.7);">mm</span>`;
        document.getElementById('porcentajeCebo').innerHTML = `${arrow} ${Math.abs(porcentaje).toFixed(1)}% vs sem. pasada`;
        document.getElementById('porcentajeCebo').style.color = colorText;
      }

      // Dibujar Gráfico Suavizado con Degradado
      const ctx = document.getElementById('graficoHistorial').getContext('2d');
      let gradiente = ctx.createLinearGradient(0, 0, 0, 200);
      gradiente.addColorStop(0, 'rgba(57, 255, 20, 0.45)'); // Verde fluorescente (Accent) con opacidad
      gradiente.addColorStop(1, 'rgba(57, 255, 20, 0.0)');  // Transparente abajo

      new Chart(ctx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: "Distancia (mm)",
            data: data,
            borderColor: "#39FF14",
            backgroundColor: gradiente,
            borderWidth: 3,
            tension: 0.4, // Curva suavizada (Spline)
            fill: true,   // Activa el sombreado interior
            pointBackgroundColor: '#fff',
            pointBorderColor: '#39FF14',
            pointRadius: 4,
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            zoom: { zoom: { wheel: { enabled: true }, mode: "x" }, pan: { enabled: true, mode: "x" } }
          },
          scales: {
            x: { 
              grid: { display: false }, 
              ticks: { color: 'rgba(255,255,255,0.6)', maxTicksLimit: 5 } 
            },
            y: { 
              beginAtZero: true, 
              grid: { color: 'rgba(255,255,255,0.15)' }, 
              ticks: { color: 'rgba(255,255,255,0.6)' } 
            }
          }
        }
      });
    });
  }

  if(tipo==="ayuda"){
    panelPro.innerHTML='<h3 style="margin-top:0">Sistema de Monitoreo</h3><p>Detecta el consumo del cebo térmítico calculando la variación de distancia milimétrica en la sonda.</p><p>Soporte: soporte@empresa.cl</p>';
  }
}

function descargarCSV(){
  firebase.database().ref("historial").once("value",snap=>{
    let csv="FechaHora,Distancia_mm\n";
    snap.forEach(c=>{
      const d=c.val();
      csv+=`${d.FechaHora},${d.Distancia_mm}\n`;
    });
    const blob=new Blob([csv]);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="historial_cebo.csv";
    a.click();
  });
}
</script>

</body>
</html>
