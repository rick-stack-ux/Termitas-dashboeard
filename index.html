<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Panel Sondas T</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#FFFFFF;
  --card:#2ECC0F;
  --text:#FFFFFF;
  --muted:rgba(255,255,255,0.75);
  --accent:#39FF14;
  --danger:#ff3b3b;
  --shadow:0 8px 20px rgba(0,0,0,0.35);
}

html,body{
  margin:0;
  padding:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100%;
}

.app{max-width:1200px;margin:18px auto;padding:14px;}

.header-logo{
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}
.header-logo img{height:150px;}

.header{text-align:center;margin-bottom:16px;}
.title h1{margin:0;font-size:20px;}
.title p{margin:0;color:var(--muted);font-size:13px;}

.summary{
  display:flex;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
  justify-content:center;
}
.metric{
  background:var(--card);
  padding:12px 14px;
  border-radius:10px;
  box-shadow:var(--shadow);
  min-width:140px;
  text-align:center;
}
.metric small{display:block;color:var(--muted);font-size:12px;}
.metric b{display:block;font-size:18px;margin-top:6px;}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:14px;
  box-shadow:var(--shadow);
  border:2px solid transparent;
  position:relative; /* NECESARIO PARA WIFI */
}
.card.alert{border-color:var(--danger);}
.card.inactive{opacity:.35;filter:grayscale(.1);}

.sonda-title{font-weight:600;font-size:15px;margin-bottom:8px;}
.tog{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:8px;}

/* ===== WIFI INDICADOR (NUEVO, NO TOCA NADA) ===== */
.wifi-ind{
  position:absolute;
  top:10px;
  right:10px;
  cursor:pointer;
}
.wifi-bars{
  display:flex;
  gap:3px;
}
.wifi-bars span{
  width:4px;
  background:#fff;
  border-radius:2px;
  opacity:.25;
}
.wifi-bars span:nth-child(1){height:6px;}
.wifi-bars span:nth-child(2){height:10px;}
.wifi-bars span:nth-child(3){height:14px;}
.wifi-bars span:nth-child(4){height:18px;}

.wifi-good span{opacity:1;}
.wifi-mid span:nth-child(-n+3){opacity:1;}
.wifi-bad span:nth-child(-n+2){opacity:1;}

.wifi-pop{
  display:none;
  position:absolute;
  top:22px;
  right:0;
  background:rgba(0,0,0,0.85);
  padding:8px 10px;
  border-radius:8px;
  font-size:12px;
  box-shadow:0 6px 14px rgba(0,0,0,0.45);
  white-space:nowrap;
}

/* ===== RECUADRO SOMBRÍO ===== */
.meter-box{
  background:rgba(0,0,0,0.30);
  border-radius:12px;
  padding:8px 6px 6px 6px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.08),
    0 6px 14px rgba(0,0,0,0.45);
  margin:6px 0 8px 0;
}

.charts{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  padding:6px 0;
}
canvas{width:110px!important;height:110px!important;}

.labels{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

.lbl{font-size:12px;color:rgba(255,255,255,0.85);text-align:center;min-width:95px;}
.val{font-weight:700;font-size:15px;color:#fff;}

.note{
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}
</style>
</head>

<body>
<div class="app">

  <div class="header-logo">
    <img src="logo.png" alt="IguanaLab">
  </div>

  <div class="header">
    <div class="title">
      <h1>Panel Sondas T</h1>
      <p>Monitoreo: Temperatura · Humedad · Distancia (mm)</p>
    </div>
  </div>

  <div class="summary">
    <div class="metric"><small>Sondas activas</small><b id="numActivas">0</b></div>
    <div class="metric"><small>Alertas distancia</small><b id="numAlertas">0</b></div>
    <div class="metric"><small>Temp. promedio</small><b id="promTemp">-- °C</b></div>
    <div class="metric"><small>Humedad promedio</small><b id="promHum">-- %</b></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="note">Umbral alerta distancia: <b>> 40 mm</b></div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ===== LÓGICA ORIGINAL (NO TOCADA) ===== */
const NUM = 5;
const chartsT=[], chartsH=[], active=[true,false,false,false,false], lastValues=Array(NUM).fill(null);

function tempColor(v){return v<=22?'rgba(46,204,113,.85)':v<=28?'rgba(241,196,15,.85)':'rgba(231,76,60,.9)';}
function humColor(v){return v<=30?'rgba(52,152,219,.85)':v<=60?'rgba(41,128,185,.9)':'rgba(31,97,141,.95)';}

function wifiClass(r){return r>=-60?'wifi-good':r>=-75?'wifi-mid':'wifi-bad';}

function createCard(i){
  const g=document.getElementById('grid');
  const c=document.createElement('div');
  c.className='card';
  c.innerHTML=`
    <div class="wifi-ind" id="wifi-${i}">
      <div class="wifi-bars"><span></span><span></span><span></span><span></span></div>
      <div class="wifi-pop" id="wifiPop-${i}"></div>
    </div>
    <div class="sonda-title">Sonda ${i+1}</div>
    <div class="tog"><label><input type="checkbox" checked> Activar</label></div>
    <div class="meter-box">
      <div class="charts">
        <canvas id="t-${i}"></canvas>
        <canvas id="h-${i}"></canvas>
      </div>
      <div class="labels">
        <div class="lbl">Temp<div class="val" id="tv-${i}">--</div></div>
        <div class="lbl">Hum<div class="val" id="hv-${i}">--</div></div>
      </div>
    </div>`;
  g.appendChild(c);

  c.querySelector(`#wifi-${i}`).onclick=()=>{
    const p=c.querySelector(`#wifiPop-${i}`);
    p.style.display=p.style.display==='block'?'none':'block';
  };

  chartsT[i]=new Chart(document.getElementById(`t-${i}`),{type:'doughnut',data:{datasets:[{data:[0,50],backgroundColor:[tempColor(0),'#0005'],borderWidth:0}]},options:{rotation:-90,circumference:180,cutout:'72%',plugins:{legend:{display:false}}}});
  chartsH[i]=new Chart(document.getElementById(`h-${i}`),{type:'doughnut',data:{datasets:[{data:[0,100],backgroundColor:[humColor(0),'#0005'],borderWidth:0}]},options:{rotation:-90,circumference:180,cutout:'72%',plugins:{legend:{display:false}}}});
}

for(let i=0;i<NUM;i++)createCard(i);

firebase.initializeApp({databaseURL:"https://enlace-t-default-rtdb.firebaseio.com"});

firebase.database().ref("prueba").on("value",s=>{
  const d=s.val()||{};
  for(let i=0;i<NUM;i++){
    document.getElementById(`tv-${i}`).textContent=d.Temperatura_C+" °C";
    document.getElementById(`hv-${i}`).textContent=d.Humedad_pct+" %";
    chartsT[i].data.datasets[0].data=[d.Temperatura_C,50-d.Temperatura_C];
    chartsH[i].data.datasets[0].data=[d.Humedad_pct,100-d.Humedad_pct];
    chartsT[i].update();chartsH[i].update();

    const w=document.getElementById(`wifi-${i}`);
    w.className='wifi-ind '+wifiClass(d.WiFi_RSSI||-100);
    document.getElementById(`wifiPop-${i}`).innerHTML=
      `<b>${d.WiFi_SSID||'--'}</b><br>${d.WiFi_RSSI||'--'} dBm`;
  }
});
</script>
</body>
</html>
