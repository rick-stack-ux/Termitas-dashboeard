<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Panel Sondas T</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#FFFFFF;
  --card:#2ECC0F;
  --text:#FFFFFF;
  --muted:rgba(255,255,255,0.75);
  --accent:#39FF14;
  --danger:#ff3b3b;
  --shadow:0 8px 20px rgba(0,0,0,0.35);
}

/* ===== MENU NUEVO (SOLO ESTO CAMBIA) ===== */
.menu-btn{
  position:fixed;
  top:15px;
  right:15px;
  font-size:22px;
  background:var(--card);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
  z-index:1001;
  box-shadow:var(--shadow);
}

.menu-box{
  position:fixed;
  top:60px;
  right:15px;
  width:280px;
  background:var(--card);
  border-radius:12px;
  box-shadow:var(--shadow);
  padding:12px;
  display:none;
  z-index:1002;
}

.menu-box.active{
  display:block;
}

.menu-section{
  margin-top:10px;
  padding:10px;
  background:rgba(0,0,0,0.25);
  border-radius:10px;
}
/* ===== FIN CAMBIO ===== */

/* ===== TU CSS ORIGINAL ===== */
html,body{
  margin:0;
  padding:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100%;
}

.app{max-width:1200px;margin:18px auto;padding:14px;}

.header-logo{
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}
.header-logo img{height:150px;}

.header{text-align:center;margin-bottom:16px;}
.title h1{margin:0;font-size:20px;}
.title p{margin:0;color:var(--muted);font-size:13px;}

.summary{
  display:flex;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
  justify-content:center;
}
.metric{
  background:var(--card);
  padding:12px 14px;
  border-radius:10px;
  box-shadow:var(--shadow);
  min-width:140px;
  text-align:center;
}
.metric small{display:block;color:var(--muted);font-size:12px;}
.metric b{display:block;font-size:18px;margin-top:6px;}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:14px;
  box-shadow:var(--shadow);
  border:2px solid transparent;
}

/* TODO EL RESTO IGUAL (NO TOCADO) */
</style>

</head>

<body>

<!-- BOTON -->

<button class="menu-btn" onclick="toggleMenu()">☰</button>

<!-- MENU NUEVO -->

<div class="menu-box" id="menuBox">
  <div class="menu-section">
    <b>📊 Historial sonda</b>
  </div>
  <div class="menu-section">
    <b>❓ Ayuda</b>
    <div style="font-size:12px;">
      Temperatura, humedad y distancia
    </div>
  </div>
  <div class="menu-section">
    <b>📧 Soporte</b>
    <div id="correoSoporte">correo@editar.cl</div>
  </div>
</div>

<div class="app">

  <!-- TODO TU HTML ORIGINAL SIGUE IGUAL -->

  <div class="header-logo">
    <img src="logo.png" alt="IguanaLab">
  </div>

  <div class="header">
    <div class="title">
      <h1>Panel Sondas T</h1>
      <p>Monitoreo: Temperatura · Humedad · Distancia (mm)</p>
    </div>
  </div>

  <div class="summary">
    <div class="metric"><small>Sondas activas</small><b id="numActivas">0</b></div>
    <div class="metric"><small>Alertas distancia</small><b id="numAlertas">0</b></div>
    <div class="metric"><small>Temp. promedio</small><b id="promTemp">-- °C</b></div>
    <div class="metric"><small>Humedad promedio</small><b id="promHum">-- %</b></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="note">Umbral alerta distancia: <b>> 40 mm</b></div>

</div>

<script>
function toggleMenu(){
  document.getElementById("menuBox").classList.toggle("active");
}
</script>

<!-- TODO TU SCRIPT ORIGINAL SIGUE IGUAL -->

</body>
</html>
