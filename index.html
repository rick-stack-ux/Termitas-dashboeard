<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Panel Sondas T</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#FFFFFF;
  --card:#2ECC0F;
  --text:#FFFFFF;
  --muted:rgba(255,255,255,0.75);
  --accent:#39FF14;
  --danger:#ff3b3b;
  --shadow:0 8px 20px rgba(0,0,0,0.35);
}

html,body{
  margin:0;
  padding:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100%;
}

.app{max-width:1200px;margin:18px auto;padding:14px;}

.header-logo{
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}
.header-logo img{height:150px;}

.header{text-align:center;margin-bottom:16px;}
.title h1{margin:0;font-size:20px;}
.title p{margin:0;color:var(--muted);font-size:13px;}

.summary{
  display:flex;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
  justify-content:center;
}
.metric{
  background:var(--card);
  padding:12px 14px;
  border-radius:10px;
  box-shadow:var(--shadow);
  min-width:140px;
  text-align:center;
}
.metric small{display:block;color:var(--muted);font-size:12px;}
.metric b{display:block;font-size:18px;margin-top:6px;}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:14px;
  box-shadow:var(--shadow);
  border:2px solid transparent;
  transition: all 0.3s ease;
}

.card.alert{
  border-color:#ff0000 !important;
  box-shadow:0 0 15px rgba(255,0,0,0.7);
}

.card.inactive{
  opacity:.4;
  filter:grayscale(1);
}

.sonda-title{font-weight:600;font-size:15px;margin-bottom:8px; display:flex; align-items:center; gap:8px;}
.btn-config{background:rgba(0,0,0,0.2); border:none; border-radius:4px; cursor:pointer; font-size:14px; padding:3px 6px; transition:0.2s;}
.btn-config:hover{background:rgba(0,0,0,0.4); transform:scale(1.1);}

.tog{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:8px;}

.meter-box{
  background:#000020;
  border-radius:12px;
  padding:8px 6px 6px 6px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.08),
    0 6px 14px rgba(0,0,0,0.45);
  margin:6px 0 8px 0;
}

.charts{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  padding:6px 0;
}

.charts canvas { width:110px !important; height:110px !important; }

.labels{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

.lbl{
  font-size:12px;
  color:rgba(255,255,255,0.85);
  text-align:center;
  min-width:95px;
}

.val{
  font-weight:700;
  font-size:15px;
  color:#ffffff;
}

.presenciaAlert{
  font-weight:700;
  text-align:center;
  padding:8px 6px;
  margin-top:8px;
  border-radius:8px;
  background:rgba(255,0,0,0.08);
  color:#ff0000;
  min-height:44px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.note{
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}
</style>

</head>

<body>

  <div class="header-logo">
    <img src="logo.png" alt="IguanaLab" onerror="this.style.display='none'">
  </div>

  <div class="header">
    <div class="title">
      <h1>Panel Sondas T</h1>
      <p>Monitoreo: Temperatura · Humedad · Distancia (mm)</p>
    </div>
  </div>

  <div class="summary">
    <div class="metric"><small>Sondas activas</small><b id="numActivas">0</b></div>
    <div class="metric"><small>Alertas distancia</small><b id="numAlertas">0</b></div>
    <div class="metric"><small>Temp. promedio</small><b id="promTemp">-- °C</b></div>
    <div class="metric"><small>Humedad promedio</small><b id="promHum">-- %</b></div>
  </div>

  <div class="grid" id="grid"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
function estadoConexion(fechaStr){
  if(!fechaStr) return "OFFLINE";
  const p = fechaStr.split(" ");
  if(p.length < 2) return "OFFLINE";
  const f = p[0].split("/");
  const h = p[1].split(":");
  const fechaDato = new Date(f[2], f[1]-1, f[0], h[0], h[1], h[2]);
  const ahora = new Date();
  const diffMin = (ahora - fechaDato)/60000;
  return diffMin <= 720 ? "ONLINE" : "OFFLINE";
}

const NUM = 5; 
const isOnline = [false,false,false,false,false]; 
const umbrales = [40, 40, 40, 40, 40]; // Umbral por defecto para cada sonda
const chartsT = [], chartsH = [], 
      lastValues = Array(NUM).fill(null), badCount = Array(NUM).fill(0);

function tempColor(v){
  return v <= 22 ? 'rgba(46,204,113,0.85)' :
         v <= 28 ? 'rgba(241,196,15,0.85)' :
         'rgba(231,76,60,0.9)';
}

function humColor(v){
  return v <= 30 ? 'rgba(52,152,219,0.85)' :
         v <= 60 ? 'rgba(41,128,185,0.9)' :
         'rgba(31,97,141,0.95)';
}

function createCard(i){
  const grid=document.getElementById('grid');
  const card=document.createElement('div');
  card.className='card inactive'; 
  card.id=`card-${i+1}`;

  card.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div class="sonda-title">Sonda ${i+1} <button class="btn-config" onclick="abrirConfig(${i+1})" title="Ajustar Offsets y Umbral">⚙️</button></div>
      <div style="text-align:right;font-size:12px;">
        <div id="estado-${i+1}">🔴 OFFLINE</div>
        <div id="wifi-${i+1}">📶 --</div>
      </div>
    </div>

    <div class="tog">
      <div style="font-size:12px; font-weight:bold; color:var(--muted);" id="auto-${i+1}">Buscando señal...</div>
      <div style="flex:1"></div>
      <div style="font-size:12px;color:var(--muted)">Dist: <span id="dist-${i+1}">--</span></div>
    </div>

    <div class="meter-box">
      <div class="charts">
        <canvas id="t-${i+1}"></canvas>
        <canvas id="h-${i+1}"></canvas>
      </div>
      <div class="labels">
        <div class="lbl">Temperatura<div class="val" id="tempVal-${i+1}">-- °C</div></div>
        <div class="lbl">Humedad<div class="val" id="humVal-${i+1}">-- %</div></div>
      </div>
    </div>
  `;
  grid.appendChild(card);

  const pres=document.createElement('div');
  pres.className='presenciaAlert'; pres.id=`pres-${i+1}`;
  card.appendChild(pres);

  chartsT[i]=new Chart(document.getElementById(`t-${i+1}`),{
    type:'doughnut',
    data:{datasets:[{data:[0,100],backgroundColor:[tempColor(0),'rgba(0,0,0,0.35)'],borderWidth:0}]},
    options:{rotation:-90,circumference:180,cutout:'72%',plugins:{legend:{display:false}}}
  });

  chartsH[i]=new Chart(document.getElementById(`h-${i+1}`),{
    type:'doughnut',
    data:{datasets:[{data:[0,100],backgroundColor:[humColor(0),'rgba(0,0,0,0.35)'],borderWidth:0}]},
    options:{rotation:-90,circumference:180,cutout:'72%',plugins:{legend:{display:false}}}
  });
}

function updateSummary(){
  let act=0,alerts=0,sumT=0,sumH=0,count=0;
  for(let i=0;i<NUM;i++){
    if(!isOnline[i]) continue;
    
    act++;
    if(!lastValues[i]) continue;
    sumT+=lastValues[i].t;
    sumH+=lastValues[i].h;
    count++;
    if(lastValues[i].dist >= umbrales[i]) alerts++;
  }
  numActivas.textContent=act;
  numAlertas.textContent=alerts;
  promTemp.textContent=(count?Math.round(sumT/count):'--')+' °C';
  promHum.textContent=(count?Math.round(sumH/count):'--')+' %';
}

for(let i=0;i<NUM;i++) createCard(i);
updateSummary();

// INICIALIZAR FIREBASE
firebase.initializeApp({
  authDomain: "enlace-t.firebaseapp.com",
  databaseURL: "https://enlace-t-default-rtdb.firebaseio.com",
  projectId: "enlace-t"
});

// ESCUCHAR CONFIGURACIONES Y UMBRALES DINÁMICOS
for(let i=0; i<NUM; i++){
  let sondaId = i + 1;
  let nodoConfig = (sondaId === 1) ? "config" : `config${sondaId}`;
  
  firebase.database().ref(nodoConfig).on("value", s => {
    const cfg = s.val();
    if(cfg && cfg.umbral) {
      umbrales[i] = parseInt(cfg.umbral);
    }
  });
}

for(let i=0; i<NUM; i++){
  let sondaId = i + 1;
  let nodoFirebase = (sondaId === 1) ? "prueba" : `prueba${sondaId}`;

  firebase.database().ref(nodoFirebase).on("value", s => {
    const d = s.val();
    const cardEl = document.getElementById(`card-${sondaId}`);
    const autoEl = document.getElementById(`auto-${sondaId}`);
    
    if(!d) return; 

    const estado = estadoConexion(d.FechaHora);
    
    if (estado === "ONLINE") {
      isOnline[i] = true;
      cardEl.classList.remove('inactive');
      autoEl.textContent = "✔ En línea";
      autoEl.style.color = "var(--accent)";
    } else {
      isOnline[i] = false;
      cardEl.classList.add('inactive');
      autoEl.textContent = "✖ Desconectada (>12h)";
      autoEl.style.color = "var(--danger)";
    }

    const t = Number(d.Temperatura_C||0);
    const h = Number(d.Humedad_pct||0);
    const dist = Number(d.Distancia_mm||0);
    lastValues[i] = {t,h,dist};

    // Alarma basada en el umbral dinámico de cada sonda
    if(isOnline[i]){
      if(dist >= umbrales[i]){ badCount[i]++; }
      else { badCount[i]=0; }
    } else {
      badCount[i]=0;
    }

    const presEl = document.getElementById(`pres-${sondaId}`);
    if(badCount[i]>=3){
      presEl.textContent = "🚨 POSIBLE TERMITA";
      cardEl.classList.add("alert");
    }else{
      presEl.textContent = "";
      cardEl.classList.remove("alert");
    }

    document.getElementById(`tempVal-${sondaId}`).textContent=`${t} °C`;
    document.getElementById(`humVal-${sondaId}`).textContent=`${h} %`;
    document.getElementById(`dist-${sondaId}`).textContent=`${Math.round(dist)} mm`;

    document.getElementById(`estado-${sondaId}`).textContent = estado==="ONLINE"?"🟢 ONLINE":"🔴 OFFLINE";
    document.getElementById(`wifi-${sondaId}`).textContent = estado==="ONLINE"?"📶 Conectado":"📶 Sin señal";

    const tempMax=50;
    const pct=Math.min((t/tempMax)*100,100);

    chartsT[i].data.datasets[0].data=[pct,100-pct];
    chartsT[i].data.datasets[0].backgroundColor[0]=tempColor(t);
    chartsT[i].update();

    chartsH[i].data.datasets[0].data=[h,100-h];
    chartsH[i].data.datasets[0].backgroundColor[0]=humColor(h);
    chartsH[i].update();

    updateSummary();
  });
}
</script>

<!-- ===== MODAL CONFIGURACIÓN CON CASILLA UMBRAL ===== -->
<div id="modalConfigOffsets" class="panel-pro modal-config">
  <div class="modal-header" style="padding:0 0 20px 0; border-bottom:1px solid #f1f5f9; margin-bottom:15px;">
    <h3>⚙️ Configurar Sonda <span id="confSondaId"></span></h3>
    <button class="btn-close" onclick="cerrarModal()">×</button>
  </div>
  
  <div class="input-group">
    <label>Umbral Alerta Termitas (mm)</label>
    <input type="number" step="1" id="inUmbral" placeholder="Ej: 40">
  </div>
  <div class="input-group">
    <label>Offset Temperatura (°C)</label>
    <input type="number" step="0.1" id="inOffT" placeholder="Ej: -2.0">
  </div>
  <div class="input-group">
    <label>Offset Humedad (%)</label>
    <input type="number" step="0.1" id="inOffH" placeholder="Ej: +5.0">
  </div>
  <div class="input-group">
    <label>Offset Distancia (mm)</label>
    <input type="number" step="1" id="inOffD" placeholder="Ej: -16">
  </div>
  <div class="input-group">
    <label>Tiempo Deep Sleep (minutos)</label>
    <input type="number" step="1" id="inSleep" placeholder="Ej: 1">
  </div>
  
  <button class="btn-guardar" onclick="guardarOffsetsFirebase()">💾 Guardar Ajustes</button>
</div>

<script>
let activeSondaTab = 1;
let miGraficoHistorial = null;
let currentConfigSonda = null;

btnMenuPro.onclick = () => menuPro.classList.toggle("active");

function cerrarModal() {
  document.getElementById('overlayPro').classList.remove('active');
  document.getElementById('panelPro').classList.remove('active');
  document.getElementById('modalConfigOffsets').classList.remove('active');
}

document.getElementById('overlayPro').addEventListener('click', cerrarModal);

document.addEventListener("click",(e)=>{
  if(!menuPro.contains(e.target) && !btnMenuPro.contains(e.target)){
    menuPro.classList.remove("active");
  }
});

function abrirConfig(sondaId) {
  const pass = prompt("ACCESO RESTRINGIDO\nIngrese la contraseña para configurar:");
  if (pass !== "sondTP123") {
    if (pass !== null) alert("Contraseña incorrecta. Acceso denegado.");
    return;
  }
  
  currentConfigSonda = sondaId;
  document.getElementById("confSondaId").textContent = sondaId;
  
  let nodo = (sondaId === 1) ? "config" : `config${sondaId}`;
  
  firebase.database().ref(nodo).once("value").then(snap => {
    const data = snap.val() || {};
    document.getElementById("inUmbral").value = data.umbral || 40;
    document.getElementById("inOffT").value = data.offsetTemp || 0;
    document.getElementById("inOffH").value = data.offsetHum || 0;
    document.getElementById("inOffD").value = data.offsetDist || 0;
    document.getElementById("inSleep").value = data.sleep || 1;
    
    document.getElementById('overlayPro').classList.add('active');
    document.getElementById('modalConfigOffsets').classList.add('active');
  });
}

function guardarOffsetsFirebase() {
  const u = parseInt(document.getElementById("inUmbral").value) || 40;
  const t = parseFloat(document.getElementById("inOffT").value) || 0;
  const h = parseFloat(document.getElementById("inOffH").value) || 0;
  const d = parseInt(document.getElementById("inOffD").value) || 0;
  const s = parseInt(document.getElementById("inSleep").value) || 1;
  
  if(s < 1) {
    alert("El tiempo de sueño no puede ser menor a 1 minuto.");
    return;
  }

  let nodo = (currentConfigSonda === 1) ? "config" : `config${currentConfigSonda}`;
  
  firebase.database().ref(nodo).set({
    umbral: u,
    offsetTemp: t,
    offsetHum: h,
    offsetDist: d,
    sleep: s
  }).then(() => {
    umbrales[currentConfigSonda - 1] = u; // Actualiza el umbral en la memoria local
    alert("✅ Ajustes guardados exitosamente en Firebase.");
    cerrarModal();
  }).catch(err => {
    alert("Error al guardar: " + err.message);
  });
}

function parseFechaCL(fechaStr) {
  if(!fechaStr) return new Date();
  const p = fechaStr.split(" ");
  if(p.length < 2) return new Date();
  const f = p[0].split("/");
  const h = p[1].split(":");
  return new Date(f[2], f[1]-1, f[0], h[0], h[1], h[2]);
}

function abrirMenuPro(){
  menuPro.classList.remove("active");
  document.getElementById('overlayPro').classList.add('active');
  document.getElementById('panelPro').classList.add("active");
  cargarGraficoSonda(1, document.querySelector('.tab-btn'));
}

function cargarGraficoSonda(sondaId, btnElement = null) {
  activeSondaTab = sondaId;
  
  if(btnElement) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');
  }

  document.getElementById('distanciaActual').textContent = "--";
  document.getElementById('porcentajeCebo').textContent = "Cargando...";
  document.getElementById('porcentajeCebo').style.color = "#64748b";

  let nodoHistorial = (sondaId === 1) ? "historial" : `historial${sondaId}`;
  const filtroDias = document.getElementById('rangoTiempo').value;

  firebase.database().ref(nodoHistorial).once("value", snap => {
    let rawRecords = [];
    snap.forEach(c => {
      const d = c.val();
      if(d.FechaHora) {
        rawRecords.push({
          time: parseFechaCL(d.FechaHora),
          val: Number(d.Distancia_mm||0)
        });
      }
    });

    rawRecords.sort((a,b) => a.time - b.time);

    const ahora = new Date();
    if (filtroDias !== 'all') {
      const msLimite = parseInt(filtroDias) * 24 * 60 * 60 * 1000;
      rawRecords = rawRecords.filter(r => (ahora - r.time) <= msLimite);
    }

    let labels = [];
    let data = [];

    if (rawRecords.length > 0) {
      if (filtroDias === '7') {
        let dailyData = {};
        rawRecords.forEach(r => {
          let lbl = r.time.toLocaleDateString('es-CL', {day:'2-digit', month:'2-digit'}); 
          if(!dailyData[lbl]) dailyData[lbl] = [];
          dailyData[lbl].push(r.val);
        });
        labels = Object.keys(dailyData);
        data = labels.map(l => Math.max(...dailyData[l]));

      } else {
        labels = ["Semana 1", "Semana 2", "Semana 3", "Semana 4", "Semana 5"];
        let weeklyData = {1:[], 2:[], 3:[], 4:[], 5:[]};
        let startTime = rawRecords[0].time.getTime();
        
        rawRecords.forEach(r => {
          let daysDiff = (r.time.getTime() - startTime) / (1000 * 60 * 60 * 24);
          let week = Math.floor(daysDiff / 7) + 1;
          if (week > 5) week = 5; 
          weeklyData[week].push(r.val);
        });

        let currentMax = 0;
        let currentActualWeek = Math.floor((ahora.getTime() - startTime) / (1000 * 60 * 60 * 24) / 7) + 1;
        
        for(let i=1; i<=5; i++) {
          if(weeklyData[i].length > 0) {
              currentMax = Math.max(...weeklyData[i]);
              data.push(currentMax);
          } else if (i <= currentActualWeek) {
              data.push(currentMax > 0 ? currentMax : null);
          } else {
              data.push(null);
          }
        }
      }

      const validData = data.filter(v => v !== null);
      if(validData.length > 0){
        const currentVal = validData[validData.length - 1];
        const baselineVal = validData[0]; 
        
        let diferencia = currentVal - baselineVal;
        let porcentaje = baselineVal === 0 ? 0 : (diferencia / baselineVal) * 100;
        
        let colorText = diferencia >= 0 ? "#10b981" : "#ef4444";
        let arrow = diferencia >= 0 ? "▲" : "▼";
        
        document.getElementById('distanciaActual').textContent = currentVal.toFixed(1);
        document.getElementById('porcentajeCebo').textContent = `${arrow} ${Math.abs(porcentaje).toFixed(1)}% vs inicio`;
        document.getElementById('porcentajeCebo').style.color = colorText;
      }

    } else {
      document.getElementById('distanciaActual').textContent = "0";
      document.getElementById('porcentajeCebo').textContent = "Sin datos en el periodo";
      document.getElementById('porcentajeCebo').style.color = "#64748b";
    }

    if (miGraficoHistorial) {
      miGraficoHistorial.destroy();
    }

    // 🔥 EL LÍMITE ROJO EN EL GRÁFICO SE ADAPTA AL UMBRAL DE LA SONDA
    const umbralActualSonda = umbrales[sondaId - 1] || 40;

    const ctx = document.getElementById('graficoHistorial').getContext('2d');
    let gradiente = ctx.createLinearGradient(0, 0, 0, 260);
    gradiente.addColorStop(0, 'rgba(16, 185, 129, 0.18)');
    gradiente.addColorStop(1, 'rgba(16, 185, 129, 0)');

    miGraficoHistorial = new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [
          {
            label: "Distancia (mm)",
            data: data,
            borderColor: "#10b981", 
            backgroundColor: gradiente,
            borderWidth: 2,
            tension: 0.4,
            fill: true,
            spanGaps: true,
            pointBackgroundColor: '#ffffff',
            pointBorderColor: '#10b981',
            pointBorderWidth: 2,
            pointRadius: 4,
            pointHoverRadius: 6,
            order: 2
          },
          {
            label: `Límite Termitas (${umbralActualSonda}mm)`,
            data: Array(labels.length).fill(umbralActualSonda),
            borderColor: "#ff3b3b", 
            backgroundColor: "transparent",
            borderWidth: 2,
            borderDash: [6, 4], 
            pointRadius: 0,
            pointHoverRadius: 0,
            fill: false,
            tension: 0,
            order: 1
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1e293b',
            titleFont: { size: 13 },
            bodyFont: { size: 14, weight: 'bold' },
            displayColors: false
          }
        },
        scales: {
          x: { 
            grid: { color: '#f1f5f9', drawBorder: false },
            ticks: { color: '#64748b', font: { size: 11 }, maxTicksLimit: 7 } 
          },
          y: { 
            min: 0,
            max: Math.max(60, umbralActualSonda + 20),
            grid: { color: '#f1f5f9', drawBorder: false },
            ticks: { color: '#64748b', font: { size: 11 } } 
          }
        }
      }
    });
  });
}

function descargarCSVGlobal(){
  const promesas = [];
  
  for(let i=1; i<=5; i++){
    let nodo = (i===1) ? "historial" : `historial${i}`;
    promesas.push(firebase.database().ref(nodo).once("value").then(snap => {
      return { sonda: i, data: snap.val() };
    }));
  }

  Promise.all(promesas).then(resultados => {
    let csv = "\uFEFFSonda,FechaHora,Distancia_mm\n";
    
    resultados.forEach(res => {
      if(res.data){
        Object.values(res.data).forEach(d => {
          if(d.FechaHora) {
            csv += `Sonda ${res.sonda},${d.FechaHora},${d.Distancia_mm}\n`;
          }
        });
      }
    });

    const blob = new Blob([csv], {type: "text/csv;charset=utf-8;"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "comportamiento_todas_las_sondas.csv";
    a.click();
    menuPro.classList.remove("active");
  });
}
