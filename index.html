<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Panel Sondas T</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#0b1f0f;
  --card:#2fbf1a;
  --text:#ecffe8;
  --muted:#b7f5ad;
  --accent:#7CFF00;
  --danger:#ff3b3b;
  --shadow:
    0 18px 40px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.12);
}

body.light{
  --bg:#eaffea;
  --card:#35cc1f;
  --text:#0b1f0f;
  --muted:#1e5f17;
  --accent:#2cff00;
  --danger:#e11d48;
  --shadow:
    0 16px 32px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.25);
}

html,body{
  margin:0;
  padding:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100%;
}

.logo-wrap{
  width:100%;
  display:flex;
  justify-content:center;
  margin:18px 0 10px;
}

.logo-wrap img{
  max-width:220px;
  width:70%;
  height:auto;
  filter:
    drop-shadow(0 10px 25px rgba(0,0,0,.45))
    drop-shadow(0 0 18px rgba(124,255,0,.35));
}

.app{max-width:1200px;margin:0 auto 18px;padding:14px;}

.header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px;}
.title h1{margin:0;font-size:20px;}
.title p{margin:0;color:var(--muted);font-size:13px;}

.controls{display:flex;gap:10px;align-items:center;}
.mode-btn{
  background:rgba(255,255,255,.15);
  border:none;
  color:var(--text);
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
  box-shadow:var(--shadow);
}

.summary{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.metric{
  background:var(--card);
  padding:12px 14px;
  border-radius:14px;
  box-shadow:var(--shadow);
  min-width:140px;
  text-align:center;
}
.metric small{display:block;color:var(--muted);font-size:12px;}
.metric b{display:block;font-size:18px;margin-top:6px;}

.grid{display:grid;grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));gap:16px;}

.card{
  background:var(--card);
  border-radius:18px;
  padding:14px;
  box-shadow:var(--shadow);
  position:relative;
  border:2px solid transparent;
}

.card.alert{
  border-color:var(--danger);
  box-shadow:0 20px 40px rgba(255,0,0,.35);
}

.card .sonda-title{font-weight:700;font-size:15px;margin-bottom:8px;}

.tog{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:8px;}

.charts{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px 0;}
canvas{width:110px!important;height:110px!important;}

.labels{display:flex;gap:10px;justify-content:center;margin-top:6px;flex-wrap:wrap;}
.lbl{font-size:12px;color:var(--muted);text-align:center;min-width:95px;}
.val{font-weight:700;color:var(--text);margin-top:4px;font-size:14px;}

.card.inactive{opacity:.35;filter:grayscale(.1);}

.note{margin-top:12px;color:var(--muted);font-size:13px;text-align:center;}

.presenciaAlert{
  font-weight:700;
  text-align:center;
  padding:8px 6px;
  margin-top:8px;
  border-radius:12px;
  background:rgba(0,0,0,.25);
  color:#b7f5ad;
  min-height:44px;
}
.presenciaAlert b{color:var(--danger);}
</style>
</head>

<body>

<div class="logo-wrap">
  <img src="logo.png" alt="IguanaLab">
</div>

<div class="app">
  <div class="header">
    <div class="title">
      <h1>Panel Sondas T</h1>
      <p>Monitoreo: Temperatura · Humedad · Distancia (mm)</p>
    </div>
    <div class="controls">
      <button id="modeToggle" class="mode-btn">Modo claro / oscuro</button>
      <button id="histWeek" class="mode-btn">Última semana</button>
      <button id="histMonth" class="mode-btn">Último mes</button>
    </div>
  </div>

  <div class="summary">
    <div class="metric"><small>Sondas activas</small><b id="numActivas">0</b></div>
    <div class="metric"><small>Alertas distancia</small><b id="numAlertas">0</b></div>
    <div class="metric"><small>Temp. promedio</small><b id="promTemp">-- °C</b></div>
    <div class="metric"><small>Humedad promedio</small><b id="promHum">-- %</b></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="note">Umbral alerta distancia: <b> > 40 mm </b></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- TU JS ORIGINAL VA AQUÍ, SIN CAMBIOS -->
</body>
</html>
