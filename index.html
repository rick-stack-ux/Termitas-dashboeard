<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Panel Sondas T</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#0f1720;
  --card:#0f1725;
  --text:#e6eef6;
  --muted:#9aa9bd;
  --accent:#00c8ff;
  --danger:#ff3b3b;
  --shadow:0 8px 20px rgba(2,8,23,0.6);
}

body.light{
  --bg:#f3f6fb;
  --card:#ffffff;
  --text:#1b2330;
  --muted:#556575;
  --accent:#007BFF;
  --danger:#ff3b3b;
  --shadow:0 6px 18px rgba(16,24,40,0.08);
}

html,body{
  margin:0;
  padding:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100%;
}

.app{max-width:1200px;margin:18px auto;padding:14px;}

/* ===== LOGO SUPERIOR (NO TOCA HEADER) ===== */
.header-logo{
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}
.header-logo img{
  height:70px;
  width:auto;
}

.header{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}

.title h1{margin:0;font-size:20px;}
.title p{margin:0;color:var(--muted);font-size:13px;}

.controls{display:flex;gap:10px;align-items:center;}

.mode-btn{
  background:transparent;
  border:1px solid rgba(255,255,255,0.06);
  color:var(--text);
  padding:8px 10px;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
}

.summary{
  display:flex;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

.metric{
  background:var(--card);
  padding:12px 14px;
  border-radius:10px;
  box-shadow:var(--shadow);
  min-width:140px;
  text-align:center;
}

.metric small{display:block;color:var(--muted);font-size:12px;}
.metric b{display:block;font-size:18px;margin-top:6px;}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:14px;
  box-shadow:var(--shadow);
  position:relative;
  border:2px solid transparent;
}

.card.alert{
  border-color:var(--danger);
  box-shadow:0 12px 30px rgba(255,50,50,0.12);
}

.card .sonda-title{font-weight:600;font-size:15px;margin-bottom:8px;}
.tog{font-size:13px;color:var(--muted);display:flex;gap:8px;margin-bottom:8px;}

.charts{display:flex;gap:10px;justify-content:center;}
canvas{width:110px!important;height:110px!important;}

.labels{display:flex;gap:10px;justify-content:center;margin-top:6px;}
.lbl{font-size:12px;color:var(--muted);text-align:center;}
.val{font-weight:700;color:var(--text);}

.note{margin-top:12px;color:var(--muted);font-size:13px;text-align:center;}
.presenciaAlert{font-weight:700;text-align:center;margin-top:8px;}
</style>
</head>

<body>
<div class="app">

  <!-- LOGO -->
  <div class="header-logo">
    <img src="logo.png" alt="IguanaLab">
  </div>

  <div class="header">
    <div class="title">
      <h1>Panel Sondas T</h1>
      <p>Monitoreo: Temperatura · Humedad · Distancia (mm)</p>
    </div>
    <div class="controls">
      <button id="modeToggle" class="mode-btn">Modo claro / oscuro</button>
      <button id="histWeek" class="mode-btn">Última semana</button>
      <button id="histMonth" class="mode-btn">Último mes</button>
    </div>
  </div>

  <div class="summary">
    <div class="metric"><small>Sondas activas</small><b id="numActivas">0</b></div>
    <div class="metric"><small>Alertas distancia</small><b id="numAlertas">0</b></div>
    <div class="metric"><small>Temp. promedio</small><b id="promTemp">-- °C</b></div>
    <div class="metric"><small>Humedad promedio</small><b id="promHum">-- %</b></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="note">Umbral alerta distancia: <b> > 40 mm </b></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
document.getElementById('modeToggle')
  .addEventListener('click',()=>document.body.classList.toggle('light'));
</script>

</body>
</html>
