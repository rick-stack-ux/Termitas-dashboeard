<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Panel Sondas T</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* ===== PALETA OBLIGATORIA (NO MODIFICAR) ===== */
:root{
  --monster:#39FF14;
  --monster-dark:#2ecc0f;
  --muted:rgba(255,255,255,.75);
  --shadow:0 12px 28px rgba(0,0,0,.35);
}

/* ===== BODY ===== */
html,body{
  margin:0;
  padding:0;
  font-family:system-ui,sans-serif;
  background:#ffffff;                 /* fondo global blanco puro */
  color:#000;                         /* texto base fuera de cards */
  height:100%;
}

/* ===== APP ===== */
.app{
  max-width:1200px;
  margin:18px auto;
  padding:14px;
}

/* ===== HEADER (estructura intacta) ===== */
.header{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}

/* ===== TITULOS ===== */
.title h1{
  margin:0;
  font-size:20px;
  color:#000;
}
.title p{
  margin:0;
  color:#000;
  font-size:13px;
}

/* ===== CONTROLS ===== */
.controls{
  display:flex;
  gap:10px;
  align-items:center;
}

/* ===== BOTONES ===== */
.mode-btn{
  background:#ffffff;
  color:#000;
  border:none;
  border-radius:12px;
  font-weight:700;
  padding:8px 10px;
  cursor:pointer;
}
.mode-btn:disabled{
  background:rgba(255,255,255,.4);
}

/* ===== SUMMARY ===== */
.summary{
  display:flex;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

/* ===== METRIC ===== */
.metric{
  background:var(--monster-dark);
  padding:18px;
  border-radius:18px;
  box-shadow:var(--shadow);
  min-width:140px;
  text-align:center;
}
.metric small{
  display:block;
  color:var(--muted);
  font-size:12px;
}
.metric b{
  display:block;
  font-size:18px;
  margin-top:6px;
  color:var(--monster);
}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

/* ===== CARD ===== */
.card{
  background:var(--monster-dark);
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}
.card.inactive{
  opacity:.45;
  filter:grayscale(1);
}
.card.alert{
  box-shadow:var(--shadow);
}

/* ===== TEXTOS EN CARD ===== */
.card .sonda-title{
  font-weight:600;
  font-size:15px;
  margin-bottom:8px;
  color:#ffffff;
}
.tog{
  font-size:13px;
  color:var(--muted);
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}
.lbl{
  font-size:12px;
  color:var(--muted);
  text-align:center;
  min-width:95px;
}
.val{
  font-weight:700;
  color:var(--monster);
  margin-top:4px;
  font-size:14px;
}

/* ===== CHARTS ===== */
.charts{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  padding:6px 0;
}
canvas{
  width:110px !important;
  height:110px !important;
}

/* ===== NOTE ===== */
.note{
  margin-top:12px;
  color:#000;
  font-size:13px;
  text-align:center;
}

/* ===== ALERT ===== */
.presenciaAlert{
  font-weight:700;
  text-align:center;
  padding:8px 6px;
  margin-top:8px;
  border-radius:12px;
  background:rgba(0,0,0,.18);         /* negro translúcido */
  color:var(--monster);
  min-height:44px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.presenciaAlert b{
  color:var(--monster);
}
</style>
</head>

<body>
<div class="app">
  <div class="header">
    <div class="title">
      <h1>Panel Sondas T</h1>
      <p>Monitoreo: Temperatura · Humedad · Distancia (mm)</p>
    </div>
    <div class="controls">
      <button id="modeToggle" class="mode-btn">Modo claro / oscuro</button>
      <button id="histWeek" class="mode-btn">Última semana</button>
      <button id="histMonth" class="mode-btn">Último mes</button>
    </div>
  </div>

  <div class="summary">
    <div class="metric"><small>Sondas activas</small><b id="numActivas">0</b></div>
    <div class="metric"><small>Alertas distancia</small><b id="numAlertas">0</b></div>
    <div class="metric"><small>Temp. promedio</small><b id="promTemp">-- °C</b></div>
    <div class="metric"><small>Humedad promedio</small><b id="promHum">-- %</b></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="note">Umbral alerta distancia: <b> > 40 mm </b> (4 cm → objeto caído)</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- TODO EL JS ORIGINAL PERMANECE INTACTO -->
</body>
</html>
