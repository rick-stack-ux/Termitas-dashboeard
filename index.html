<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Panel Sondas T</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#FFFFFF;
  --card:#2ECC0F;
  --text:#FFFFFF;
  --muted:rgba(255,255,255,0.75);
  --accent:#39FF14;
  --danger:#ff3b3b;
  --shadow:0 8px 20px rgba(0,0,0,0.35);
}

/* ===== MENU NUEVO ===== */
.menu-btn{
  position:fixed;
  top:15px;
  right:15px;
  font-size:22px;
  background:var(--card);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
  z-index:1001;
  box-shadow:var(--shadow);
}

.sidebar{
  position:fixed;
  top:0;
  right:-350px;
  width:320px;
  height:100%;
  background:#ffffff;
  color:#333;
  box-shadow:-5px 0 25px rgba(0,0,0,0.3);
  padding:20px;
  transition:0.3s ease;
  z-index:1002;
}

.sidebar.active{ right:0; }

.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  opacity:0;
  visibility:hidden;
  transition:0.3s;
  z-index:1000;
}

.overlay.active{
  opacity:1;
  visibility:visible;
}

#chartContainer{
  background:#fff;
  border-radius:10px;
  padding:10px;
}
/* ===== FIN MENU ===== */

/* ===== TU CSS ORIGINAL ===== */
html,body{
  margin:0;
  padding:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100%;
}

.app{max-width:1200px;margin:18px auto;padding:14px;}

.header-logo{
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}
.header-logo img{height:150px;}

.header{text-align:center;margin-bottom:16px;}
.title h1{margin:0;font-size:20px;}
.title p{margin:0;color:var(--muted);font-size:13px;}

.summary{
  display:flex;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
  justify-content:center;
}
.metric{
  background:var(--card);
  padding:12px 14px;
  border-radius:10px;
  box-shadow:var(--shadow);
  min-width:140px;
  text-align:center;
}
.metric small{display:block;color:var(--muted);font-size:12px;}
.metric b{display:block;font-size:18px;margin-top:6px;}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:14px;
  box-shadow:var(--shadow);
  border:2px solid transparent;
}

.card.alert{
  border-color:#ff0000 !important;
  box-shadow:0 0 15px rgba(255,0,0,0.7);
}

.card.inactive{opacity:.35;filter:grayscale(.1);}

.sonda-title{font-weight:600;font-size:15px;margin-bottom:8px;}
.tog{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:8px;}

.meter-box{
  background:rgba(0,0,0,0.30);
  border-radius:12px;
  padding:8px 6px 6px 6px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.08),
    0 6px 14px rgba(0,0,0,0.45);
  margin:6px 0 8px 0;
}

.charts{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  padding:6px 0;
}

canvas{width:110px!important;height:110px!important;}

.labels{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

.lbl{
  font-size:12px;
  color:rgba(255,255,255,0.85);
  text-align:center;
  min-width:95px;
}

.val{
  font-weight:700;
  font-size:15px;
  color:#ffffff;
}

.presenciaAlert{
  font-weight:700;
  text-align:center;
  padding:8px 6px;
  margin-top:8px;
  border-radius:8px;
  background:rgba(255,0,0,0.08);
  color:#ff0000;
  min-height:44px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.note{
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}
</style>

</head>

<body>

<!-- MENU -->

<button class="menu-btn" onclick="toggleMenu()">☰</button>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="sidebar" id="sidebar">
  <h2>📊 Comportamiento</h2>
  <div id="chartContainer">
    <canvas id="graficoMes"></canvas>
  </div>

  <h3 style="margin-top:20px;">📧 Soporte</h3>
  <p>soporte@tudominio.cl</p>
</div>

<div class="app">

  <!-- TODO TU HTML ORIGINAL SIGUE IGUAL -->

  <div class="header-logo">
    <img src="logo.png" alt="IguanaLab">
  </div>

  <div class="header">
    <div class="title">
      <h1>Panel Sondas T</h1>
      <p>Monitoreo: Temperatura · Humedad · Distancia (mm)</p>
    </div>
  </div>

  <div class="summary">
    <div class="metric"><small>Sondas activas</small><b id="numActivas">0</b></div>
    <div class="metric"><small>Alertas distancia</small><b id="numAlertas">0</b></div>
    <div class="metric"><small>Temp. promedio</small><b id="promTemp">-- °C</b></div>
    <div class="metric"><small>Humedad promedio</small><b id="promHum">-- %</b></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="note">Umbral alerta distancia: <b>> 40 mm</b></div>

</div>

<script>
function toggleMenu(){
  sidebar.classList.toggle("active");
  overlay.classList.toggle("active");
}
</script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

/* ===== TU CODIGO ORIGINAL (NO TOCADO) ===== */

/* TODO TODO TU CODIGO ORIGINAL COMPLETO AQUI (sin cambios) */

/* ===== HISTORIAL NIVEL INGENIERO ===== */

const datosPorDia = {};
const LIMITE = 40;

function procesar(d){
  if(!d || !d.FechaHora) return;

  const dia = parseInt(d.FechaHora.split(" ")[0].split("/")[0]);

  if(!datosPorDia[dia]){
    datosPorDia[dia]={t:[],h:[],dist:[]};
  }

  datosPorDia[dia].t.push(Number(d.Temperatura_C||0));
  datosPorDia[dia].h.push(Number(d.Humedad_pct||0));
  datosPorDia[dia].dist.push(Number(d.Distancia_mm||0));
}

function prom(arr){
  return Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
}

function generar(){
  let dias=[],t=[],h=[],d=[];
  for(let i=1;i<=31;i++){
    dias.push(i);
    if(datosPorDia[i]){
      t.push(prom(datosPorDia[i].t));
      h.push(prom(datosPorDia[i].h));
      d.push(prom(datosPorDia[i].dist));
    }else{
      t.push(null);h.push(null);d.push(null);
    }
  }
  return {dias,t,h,d};
}

const chart = new Chart(document.getElementById("graficoMes"),{
  type:"line",
  data:{
    labels:[],
    datasets:[
      {label:"📏 Distancia",data:[],borderWidth:3},
      {label:"🌡 Temp",data:[],borderWidth:1},
      {label:"💧 Hum",data:[],borderWidth:1},
      {label:"🚨 Límite",data:Array(31).fill(LIMITE),borderDash:[5,5]}
    ]
  }
});

firebase.database().ref("prueba").on("value",s=>{
  const d=s.val();

  procesar(d);

  const r=generar();

  chart.data.labels=r.dias;
  chart.data.datasets[0].data=r.d;
  chart.data.datasets[1].data=r.t;
  chart.data.datasets[2].data=r.h;

  chart.update();
});

</script>

</body>
</html>
