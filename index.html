<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Panel Sondas T</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* ===== MONSTER UI (SOLO APARIENCIA) ===== */
:root{
  --bg:#FFFFFF;
  --card:#2ECC0F;
  --text:#FFFFFF;
  --muted:rgba(255,255,255,0.75);
  --accent:#39FF14;
  --danger:#ff3b3b;
  --shadow:0 8px 20px rgba(0,0,0,0.35);
}

html,body{
  margin:0;
  padding:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100%;
}

.app{max-width:1200px;margin:18px auto;padding:14px;}

.header-logo{
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}
.header-logo img{height:150px;}

.header{text-align:center;margin-bottom:16px;}
.title h1{margin:0;font-size:20px;}
.title p{margin:0;color:var(--muted);font-size:13px;}

.summary{
  display:flex;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
  justify-content:center;
}
.metric{
  background:var(--card);
  padding:12px 14px;
  border-radius:10px;
  box-shadow:var(--shadow);
  min-width:140px;
  text-align:center;
}
.metric small{display:block;color:var(--muted);font-size:12px;}
.metric b{display:block;font-size:18px;margin-top:6px;}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:14px;
  box-shadow:var(--shadow);
  border:2px solid transparent;
}
.card.alert{border-color:var(--danger);}
.card.inactive{opacity:.35;filter:grayscale(.1);}

.sonda-title{font-weight:600;font-size:15px;margin-bottom:8px;}
.tog{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:8px;}

.meter-box{
  background:rgba(0,0,0,0.30);
  border-radius:12px;
  padding:8px 6px 6px 6px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.08),
    0 6px 14px rgba(0,0,0,0.45);
  margin:6px 0 8px 0;
}

.charts{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  padding:6px 0;
}

canvas{width:110px!important;height:110px!important;}

.labels{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

.lbl{
  font-size:12px;
  color:rgba(255,255,255,0.85);
  text-align:center;
  min-width:95px;
}

.val{
  font-weight:700;
  font-size:15px;
  color:#ffffff;
}

.presenciaAlert{
  font-weight:700;
  text-align:center;
  padding:8px 6px;
  margin-top:8px;
  border-radius:8px;
  background:rgba(255,0,0,0.08);
  color:#ff8a8a;
  min-height:44px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.note{
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}
</style>

</head>

<body>
<div class="app">

  <div class="header-logo">
    <img src="logo.png" alt="IguanaLab">
  </div>

  <div class="header">
    <div class="title">
      <h1>Panel Sondas T</h1>
      <p>Monitoreo: Temperatura · Humedad · Distancia (mm)</p>
    </div>
  </div>

  <div class="summary">
    <div class="metric"><small>Sondas activas</small><b id="numActivas">0</b></div>
    <div class="metric"><small>Alertas distancia</small><b id="numAlertas">0</b></div>
    <div class="metric"><small>Temp. promedio</small><b id="promTemp">-- °C</b></div>
    <div class="metric"><small>Humedad promedio</small><b id="promHum">-- %</b></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="note">Umbral alerta distancia: <b>> 40 mm</b></div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ===== LÓGICA ORIGINAL (NO TOCADA) ===== */
const NUM = 5, DIST_THRESHOLD_MM = 40;
const chartsT = [], chartsH = [], active = [true,false,false,false,false],
      lastValues = Array(NUM).fill(null), badCount = Array(NUM).fill(0);

/* 🔥 AGREGADO (NO INTERFIERE) */
function estadoConexion(fechaStr){
  if(!fechaStr) return "OFFLINE";
  const p = fechaStr.split(" ");
  if(p.length<2) return "OFFLINE";
  const f = p[0].split("/");
  const h = p[1].split(":");
  const fechaDato = new Date(f[2],f[1]-1,f[0],h[0],h[1],h[2]);
  return ((new Date()-fechaDato)/60000)<=5?"ONLINE":"OFFLINE";
}

/* === funciones originales === */
function tempColor(v){return v<=22?'rgba(46,204,113,0.85)':v<=28?'rgba(241,196,15,0.85)':'rgba(231,76,60,0.9)';}
function humColor(v){return v<=30?'rgba(52,152,219,0.85)':v<=60?'rgba(41,128,185,0.9)':'rgba(31,97,141,0.95)';}

/* === TODO LO DEMÁS ORIGINAL === */
function createCard(i){
  const grid=document.getElementById('grid');
  const card=document.createElement('div');
  card.className='card'; card.id=`card-${i+1}`;
  if(!active[i]) card.classList.add('inactive');

  card.innerHTML=`
    <div class="sonda-title">Sonda ${i+1}</div>
    <div class="tog">
      <label><input type="checkbox" id="toggle-${i+1}" ${active[i]?'checked':''}> Activar</label>
      <div style="flex:1"></div>
      <div style="font-size:12px;color:var(--muted)">Dist: <span id="dist-${i+1}">--</span></div>
    </div>

    <div class="meter-box">
      <div class="charts">
        <canvas id="t-${i+1}"></canvas>
        <canvas id="h-${i+1}"></canvas>
      </div>
      <div class="labels">
        <div class="lbl">Temperatura<div class="val" id="tempVal-${i+1}">-- °C</div></div>
        <div class="lbl">Humedad<div class="val" id="humVal-${i+1}">-- %</div></div>
      </div>
    </div>
  `;
  grid.appendChild(card);

  const pres=document.createElement('div');
  pres.className='presenciaAlert'; pres.id=`pres-${i+1}`;
  card.appendChild(pres);

  chartsT[i]=new Chart(document.getElementById(`t-${i+1}`),{type:'doughnut',data:{datasets:[{data:[0,50],backgroundColor:[tempColor(0),'rgba(0,0,0,0.35)'],borderWidth:0}]},options:{cutout:'72%'}});
  chartsH[i]=new Chart(document.getElementById(`h-${i+1}`),{type:'doughnut',data:{datasets:[{data:[0,100],backgroundColor:[humColor(0),'rgba(0,0,0,0.35)'],borderWidth:0}]},options:{cutout:'72%'}});
}

for(let i=0;i<NUM;i++) createCard(i);

firebase.initializeApp({
  authDomain:"enlace-t.firebaseapp.com",
  databaseURL:"https://enlace-t-default-rtdb.firebaseio.com",
  projectId:"enlace-t"
});

firebase.database().ref("prueba").on("value",s=>{
  const d=s.val()||{};
  const fecha=d.FechaHora||"";

  for(let i=0;i<NUM;i++){
    if(!active[i]) continue;

    const t=Number(d.Temperatura_C||0);
    const h=Number(d.Humedad_pct||0);
    const dist=Number(d.Distancia_mm||0);

    lastValues[i]={t,h,dist};

    document.getElementById(`tempVal-${i+1}`).textContent=`${t} °C`;
    document.getElementById(`humVal-${i+1}`).textContent=`${h} %`;
    document.getElementById(`dist-${i+1}`).textContent=`${Math.round(dist)} mm`;

    chartsT[i].data.datasets[0].data=[t,50-t]; chartsT[i].update();
    chartsH[i].data.datasets[0].data=[h,100-h]; chartsH[i].update();

    /* 🔥 SOLO AGREGADO */
    if(dist > DIST_THRESHOLD_MM){ badCount[i]++; } else { badCount[i]=0; }

    const presEl=document.getElementById(`pres-${i+1}`);
    if(badCount[i]>=3){ presEl.textContent="⚠️ POSIBLE TERMITA"; }
    else{ presEl.textContent=""; }

    let el=document.getElementById(`estado-${i+1}`);
    if(!el){
      el=document.createElement("div");
      el.id=`estado-${i+1}`;
      el.style.fontSize="12px";
      document.getElementById(`card-${i+1}`).appendChild(el);
    }
    const estado=estadoConexion(fecha);
    el.textContent="Estado: "+estado;
    el.style.color=estado==="ONLINE"?"#00ff88":"#ff3b3b";
  }
});
</script>

</body>
</html>
