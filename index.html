<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Panel Sondas T</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* ===== MODO MONSTER (POR DEFECTO) ===== */
:root{
  --bg:#FFFFFF;
  --card:#2ECC0F;
  --text:#FFFFFF;
  --muted:rgba(255,255,255,0.75);
  --accent:#39FF14;
  --danger:#ff3b3b;
  --shadow:0 8px 20px rgba(0,0,0,0.35);
}

/* ===== BASE ===== */
html,body{
  margin:0;
  padding:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100%;
}

.app{
  max-width:1200px;
  margin:18px auto;
  padding:14px;
}

/* ===== LOGO ===== */
.header-logo{
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}
.header-logo img{
  height:70px;
  width:auto;
}

/* ===== HEADER ===== */
.header{
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:16px;
  text-align:center;
}
.title h1{margin:0;font-size:20px;}
.title p{margin:0;color:var(--muted);font-size:13px;}

/* ===== SUMMARY ===== */
.summary{
  display:flex;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
  justify-content:center;
}
.metric{
  background:var(--card);
  padding:12px 14px;
  border-radius:10px;
  box-shadow:var(--shadow);
  min-width:140px;
  text-align:center;
}
.metric small{display:block;color:var(--muted);font-size:12px;}
.metric b{display:block;font-size:18px;margin-top:6px;}

/* ===== GRID ===== */
.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:16px;
}

/* ===== CARD ===== */
.card{
  background:var(--card);
  border-radius:12px;
  padding:14px;
  box-shadow:var(--shadow);
  border:2px solid transparent;
}
.card.alert{border-color:var(--danger);}
.card.inactive{opacity:.35;filter:grayscale(.1);}
.sonda-title{font-weight:600;font-size:15px;margin-bottom:8px;}

.tog{
  font-size:13px;
  color:var(--muted);
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}

.charts{
  display:flex;
  gap:10px;
  justify-content:center;
}
canvas{width:110px!important;height:110px!important;}

.labels{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:6px;
}
.lbl{font-size:12px;color:var(--muted);text-align:center;}
.val{font-weight:700;font-size:14px;}

.presenciaAlert{
  margin-top:8px;
  padding:8px;
  border-radius:8px;
  background:rgba(255,0,0,0.08);
  color:#ff8a8a;
  text-align:center;
}

.note{
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}
</style>
</head>

<body>
<div class="app">

  <!-- LOGO -->
  <div class="header-logo">
    <img src="logo.png" alt="IguanaLab">
  </div>

  <!-- TITULO -->
  <div class="header">
    <div class="title">
      <h1>Panel Sondas T</h1>
      <p>Monitoreo: Temperatura · Humedad · Distancia (mm)</p>
    </div>
  </div>

  <!-- RESUMEN -->
  <div class="summary">
    <div class="metric"><small>Sondas activas</small><b id="numActivas">0</b></div>
    <div class="metric"><small>Alertas distancia</small><b id="numAlertas">0</b></div>
    <div class="metric"><small>Temp. promedio</small><b id="promTemp">-- °C</b></div>
    <div class="metric"><small>Humedad promedio</small><b id="promHum">-- %</b></div>
  </div>

  <!-- GRID -->
  <div class="grid" id="grid"></div>

  <div class="note">Umbral alerta distancia: <b>> 40 mm</b></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const NUM=5,DIST_THRESHOLD_MM=40;
const chartsT=[],chartsH=[],active=[true,false,false,false,false];
const lastValues=Array(NUM).fill(null),badCount=Array(NUM).fill(0);

function tempColor(v){return v<=25?'rgba(46,204,113,.8)':v<=30?'rgba(241,196,15,.8)':'rgba(231,76,60,.8)'}
function humColor(v){
  if(v<=20)return'rgba(135,206,250,.8)';
  if(v<=40)return'rgba(0,162,255,.8)';
  if(v<=60)return'rgba(46,204,113,.8)';
  if(v<=80)return'rgba(241,196,15,.8)';
  return'rgba(231,76,60,.8)';
}

function createCard(i){
  const g=document.getElementById('grid');
  const c=document.createElement('div');
  c.className='card';c.id=`card-${i+1}`;
  c.innerHTML=`
  <div class="sonda-title">Sonda ${i+1}</div>
  <div class="tog"><label><input type="checkbox" checked> Activar</label>
  <div style="flex:1"></div>Dist: <span id="dist-${i+1}">--</span></div>
  <div class="charts"><canvas id="t-${i+1}"></canvas><canvas id="h-${i+1}"></canvas></div>
  <div class="labels">
    <div class="lbl">Temp<div class="val" id="tempVal-${i+1}">--</div></div>
    <div class="lbl">Hum<div class="val" id="humVal-${i+1}">--</div></div>
  </div>`;
  g.appendChild(c);

  chartsT[i]=new Chart(document.getElementById(`t-${i+1}`),{
    type:'doughnut',
    data:{datasets:[{data:[0,50],backgroundColor:[tempColor(0),'#000'],borderWidth:0}]},
    options:{rotation:-90,circumference:180,cutout:'72%',plugins:{legend:{display:false}}}
  });
  chartsH[i]=new Chart(document.getElementById(`h-${i+1}`),{
    type:'doughnut',
    data:{datasets:[{data:[0,100],backgroundColor:[humColor(0),'#000'],borderWidth:0}]},
    options:{rotation:-90,circumference:180,cutout:'72%',plugins:{legend:{display:false}}}
  });
}

for(let i=0;i<NUM;i++)createCard(i);

/* FIREBASE */
firebase.initializeApp({databaseURL:"https://enlace-t-default-rtdb.firebaseio.com/"});
firebase.database().ref("prueba").on("value",s=>{
  const d=s.val()||{};
  for(let i=0;i<NUM;i++){
    const t=Number(d.Temperatura_C||0),h=Number(d.Humedad_pct||0),dist=Number(d.Distancia_mm||0);
    document.getElementById(`tempVal-${i+1}`).textContent=t+" °C";
    document.getElementById(`humVal-${i+1}`).textContent=h+" %";
    document.getElementById(`dist-${i+1}`).textContent=Math.round(dist)+" mm";
    chartsT[i].data.datasets[0].data=[t,50-t];
    chartsT[i].data.datasets[0].backgroundColor[0]=tempColor(t);
    chartsT[i].update();
    chartsH[i].data.datasets[0].data=[h,100-h];
    chartsH[i].data.datasets[0].backgroundColor[0]=humColor(h);
    chartsH[i].update();
  }
});
</script>
</body>
</html>
