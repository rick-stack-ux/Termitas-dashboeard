<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Panel Sondas T</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* ===== MODO MONSTER (POR DEFECTO) ===== */
:root{
  --bg:#FFFFFF;
  --card:#2ECC0F;
  --text:#FFFFFF;
  --muted:rgba(255,255,255,0.75);
  --accent:#39FF14;
  --danger:#ff3b3b;
  --shadow:0 8px 20px rgba(0,0,0,0.35);
}

/* ===== BASE (NO TOCADA) ===== */
html,body{
  margin:0;
  padding:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100%;
}

.app{max-width:1200px;margin:18px auto;padding:14px;}

/* ===== LOGO ===== */
.header-logo{
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}
.header-logo img{
  height:70px;
  width:auto;
}

/* ===== HEADER (MISMA DISPOSICIÓN) ===== */
.header{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}

.title h1{margin:0;font-size:20px;}
.title p{margin:0;color:var(--muted);font-size:13px;}

/* ===== SUMMARY ===== */
.summary{
  display:flex;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

.metric{
  background:var(--card);
  padding:12px 14px;
  border-radius:10px;
  box-shadow:var(--shadow);
  min-width:140px;
  text-align:center;
}

.metric small{display:block;color:var(--muted);font-size:12px;}
.metric b{display:block;font-size:18px;margin-top:6px;}

/* ===== GRID / CARDS (IGUAL) ===== */
.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:14px;
  box-shadow:var(--shadow);
  position:relative;
  border:2px solid transparent;
  overflow:hidden;
}

.card.alert{
  border-color: var(--danger);
  box-shadow:0 12px 30px rgba(255,50,50,0.12);
}

.card .sonda-title{font-weight:600;font-size:15px;margin-bottom:8px;}

.tog{
  font-size:13px;
  color:var(--muted);
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}

.charts{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  padding:6px 0;
}

canvas{width:110px!important;height:110px!important;}

.labels{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:6px;
  flex-wrap:wrap;
}

.lbl{font-size:12px;color:var(--muted);text-align:center;min-width:95px;}
.val{font-weight:700;color:var(--text);margin-top:4px;font-size:14px;}

.card.inactive{opacity:.35;filter:grayscale(.1);}

.note{
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}

.presenciaAlert{
  font-weight:700;
  text-align:center;
  padding:8px 6px;
  margin-top:8px;
  border-radius:8px;
  background:rgba(255,0,0,0.04);
  color:#ff8a8a;
  min-height:44px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.presenciaAlert b{color:var(--danger);}
</style>
</head>

<body>
<div class="app">

  <!-- LOGO -->
  <div class="header-logo">
    <img src="logo.png" alt="IguanaLab">
  </div>

  <!-- HEADER ORIGINAL -->
  <div class="header">
    <div class="title">
      <h1>Panel Sondas T</h1>
      <p>Monitoreo: Temperatura · Humedad · Distancia (mm)</p>
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="summary">
    <div class="metric"><small>Sondas activas</small><b id="numActivas">0</b></div>
    <div class="metric"><small>Alertas distancia</small><b id="numAlertas">0</b></div>
    <div class="metric"><small>Temp. promedio</small><b id="promTemp">-- °C</b></div>
    <div class="metric"><small>Humedad promedio</small><b id="promHum">-- %</b></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="note">Umbral alerta distancia: <b> > 40 mm </b> (4 cm → objeto caído)</div>
</div>

<!-- 🔥 TODO TU JS Y FIREBASE VA AQUÍ SIN CAMBIOS -->
</body>
</html>
