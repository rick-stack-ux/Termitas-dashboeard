<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Panel Sondas T</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* === COLORES MONSTER (FONDO BLANCO) === */
:root{
  --bg:#ffffff;
  --card:#2fbf1a;
  --text:#0b1f0f;
  --muted:#1e5f17;
  --accent:#7CFF00;
  --danger:#ff3b3b;

  --shadow:
    0 18px 40px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.25);
}

html,body{
  margin:0;
  padding:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100%;
}

/* === LOGO === */
.logo-wrap{
  width:100%;
  display:flex;
  justify-content:center;
  margin:18px 0 8px;
}
.logo-wrap img{
  max-width:220px;
  width:70%;
  height:auto;
  filter:
    drop-shadow(0 10px 25px rgba(0,0,0,.35))
    drop-shadow(0 0 16px rgba(124,255,0,.35));
}

/* === ESTRUCTURA ORIGINAL (SIN CAMBIOS) === */
.app{max-width:1200px;margin:0 auto 18px;padding:14px;}

.header{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}

.title h1{margin:0;font-size:20px;}
.title p{margin:0;color:#1e5f17;font-size:13px;}

.controls{display:flex;gap:10px;align-items:center;}

.mode-btn{
  background:#ffffff;
  border:none;
  color:#0b1f0f;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
  box-shadow:var(--shadow);
}

.summary{
  display:flex;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

.metric{
  background:#ffffff;
  padding:12px 14px;
  border-radius:14px;
  box-shadow:var(--shadow);
  min-width:140px;
  text-align:center;
}
.metric small{display:block;color:#1e5f17;font-size:12px;}
.metric b{display:block;font-size:18px;margin-top:6px;}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:16px;
}

/* === TARJETAS SONDA VERDE MONSTER === */
.card{
  background:var(--card);
  border-radius:18px;
  padding:14px;
  box-shadow:var(--shadow);
  position:relative;
  border:2px solid transparent;
}

.card.alert{
  border-color:var(--danger);
  box-shadow:0 20px 40px rgba(255,0,0,.35);
}

.card .sonda-title{
  font-weight:700;
  font-size:15px;
  margin-bottom:8px;
  color:#ecffe8;
}

.tog{
  font-size:13px;
  color:#d9ffd2;
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}

.charts{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  padding:6px 0;
}

/* === MEDIDORES: NO TOCADOS === */
canvas{
  width:110px !important;
  height:110px !important;
}

.labels{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:6px;
  flex-wrap:wrap;
}

.lbl{
  font-size:12px;
  color:#eaffea;
  text-align:center;
  min-width:95px;
}

.val{
  font-weight:700;
  color:#ffffff;
  margin-top:4px;
  font-size:14px;
}

.card.inactive{
  opacity:.35;
  filter:grayscale(.1);
}

.note{
  margin-top:12px;
  color:#1e5f17;
  font-size:13px;
  text-align:center;
}

.presenciaAlert{
  font-weight:700;
  text-align:center;
  padding:8px 6px;
  margin-top:8px;
  border-radius:12px;
  background:rgba(0,0,0,.25);
  color:#eaffea;
  min-height:44px;
}
.presenciaAlert b{color:var(--danger);}
</style>
</head>

<body>

<div class="logo-wrap">
  <img src="logo.png" alt="IguanaLab">
</div>

<!-- DESDE AQUÍ HACIA ABAJO: TU HTML + JS ORIGINAL EXACTO -->
<!-- NO SE ELIMINÓ NADA DE LA ESTRUCTURA -->

</body>
</html>
