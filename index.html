<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Panel Sondas T</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#FFFFFF;
  --card:#2ECC0F;
  --text:#FFFFFF;
  --muted:rgba(255,255,255,0.75);
  --accent:#39FF14;
  --danger:#ff3b3b;
  --shadow:0 8px 20px rgba(0,0,0,0.35);
}

/* MENU */
.menu-btn{
  position:fixed;
  top:15px;
  right:15px;
  font-size:22px;
  background:var(--card);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
  z-index:1001;
  box-shadow:var(--shadow);
}

.sidebar{
  position:fixed;
  top:0;
  right:-320px;
  width:300px;
  height:100%;
  background:#ffffff;
  color:#333;
  box-shadow:-5px 0 20px rgba(0,0,0,0.4);
  padding:20px;
  transition:0.3s ease;
  z-index:1002;
}

.sidebar.active{ right:0; }

.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  opacity:0;
  visibility:hidden;
  transition:0.3s;
  z-index:1000;
}

.overlay.active{
  opacity:1;
  visibility:visible;
}

.menu-section{
  margin-top:20px;
  padding:12px;
  background:rgba(0,0,0,0.05);
  border-radius:10px;
}

/* RESTO ORIGINAL */
html,body{
  margin:0;
  padding:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100%;
}

.app{max-width:1200px;margin:18px auto;padding:14px;}

.header-logo{
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}
.header-logo img{height:150px;}

.header{text-align:center;margin-bottom:16px;}
.title h1{margin:0;font-size:20px;}
.title p{margin:0;color:var(--muted);font-size:13px;}

.summary{
  display:flex;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
  justify-content:center;
}
.metric{
  background:var(--card);
  padding:12px 14px;
  border-radius:10px;
  box-shadow:var(--shadow);
  min-width:140px;
  text-align:center;
}
.metric small{display:block;color:var(--muted);font-size:12px;}
.metric b{display:block;font-size:18px;margin-top:6px;}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:14px;
  box-shadow:var(--shadow);
  border:2px solid transparent;
}

.card.alert{
  border-color:#ff0000 !important;
  box-shadow:0 0 15px rgba(255,0,0,0.7);
}

.card.inactive{opacity:.35;filter:grayscale(.1);}

.sonda-title{font-weight:600;font-size:15px;margin-bottom:8px;}
.tog{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:8px;}

.meter-box{
  background:rgba(0,0,0,0.30);
  border-radius:12px;
  padding:8px 6px 6px 6px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.08),
    0 6px 14px rgba(0,0,0,0.45);
  margin:6px 0 8px 0;
}

.charts{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  padding:6px 0;
}

canvas{width:110px!important;height:110px!important;}

.labels{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

.lbl{
  font-size:12px;
  color:rgba(255,255,255,0.85);
  text-align:center;
  min-width:95px;
}

.val{
  font-weight:700;
  font-size:15px;
  color:#ffffff;
}

.presenciaAlert{
  font-weight:700;
  text-align:center;
  padding:8px 6px;
  margin-top:8px;
  border-radius:8px;
  background:rgba(255,0,0,0.08);
  color:#ff0000;
  min-height:44px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.note{
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}
</style>

</head>

<body>

<button class="menu-btn" onclick="toggleMenu()">☰</button>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="sidebar" id="sidebar">
  <h2>Menú</h2>

  <div class="menu-section">
    <h3>📊 Comportamiento de la Sonda</h3>
    <canvas id="graficoMes"></canvas>
  </div>

  <div class="menu-section">
    <h3>📧 Soporte</h3>
    <p id="correoSoporte">soporte@tudominio.cl</p>
  </div>
</div>

<div class="app">

  <div class="header-logo">
    <img src="logo.png" alt="IguanaLab">
  </div>

  <div class="header">
    <div class="title">
      <h1>Panel Sondas T</h1>
      <p>Monitoreo: Temperatura · Humedad · Distancia (mm)</p>
    </div>
  </div>

  <div class="summary">
    <div class="metric"><small>Sondas activas</small><b id="numActivas">0</b></div>
    <div class="metric"><small>Alertas distancia</small><b id="numAlertas">0</b></div>
    <div class="metric"><small>Temp. promedio</small><b id="promTemp">-- °C</b></div>
    <div class="metric"><small>Humedad promedio</small><b id="promHum">-- %</b></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="note">Umbral alerta distancia: <b>> 40 mm</b></div>

</div>

<script>
function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("active");
  document.getElementById("overlay").classList.toggle("active");
}
</script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

/* ===== TU CODIGO ORIGINAL ===== */

function estadoConexion(fechaStr){
  if(!fechaStr) return "OFFLINE";
  const p = fechaStr.split(" ");
  if(p.length < 2) return "OFFLINE";
  const f = p[0].split("/");
  const h = p[1].split(":");
  const fechaDato = new Date(f[2], f[1]-1, f[0], h[0], h[1], h[2]);
  const ahora = new Date();
  const diffMin = (ahora - fechaDato)/60000;
  return diffMin <= 1.5 ? "ONLINE" : "OFFLINE";
}

const NUM = 5, DIST_THRESHOLD_MM = 40;
const chartsT = [], chartsH = [], active = [true,false,false,false,false],
      lastValues = Array(NUM).fill(null), badCount = Array(NUM).fill(0);

function tempColor(v){
  return v <= 22 ? 'rgba(46,204,113,0.85)' :
         v <= 28 ? 'rgba(241,196,15,0.85)' :
         'rgba(231,76,60,0.9)';
}

function humColor(v){
  return v <= 30 ? 'rgba(52,152,219,0.85)' :
         v <= 60 ? 'rgba(41,128,185,0.9)' :
         'rgba(31,97,141,0.95)';
}

function createCard(i){
  const grid=document.getElementById('grid');
  const card=document.createElement('div');
  card.className='card'; card.id=`card-${i+1}`;
  if(!active[i]) card.classList.add('inactive');

  card.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div class="sonda-title">Sonda ${i+1}</div>
      <div style="text-align:right;font-size:12px;">
        <div id="estado-${i+1}">🔴 OFFLINE</div>
        <div id="wifi-${i+1}">📶 --</div>
      </div>
    </div>

    <div class="tog">
      <label><input type="checkbox" id="toggle-${i+1}" ${active[i]?'checked':''}> Activar</label>
      <div style="flex:1"></div>
      <div style="font-size:12px;color:var(--muted)">Dist: <span id="dist-${i+1}">--</span></div>
    </div>

    <div class="meter-box">
      <div class="charts">
        <canvas id="t-${i+1}"></canvas>
        <canvas id="h-${i+1}"></canvas>
      </div>
      <div class="labels">
        <div class="lbl">Temperatura<div class="val" id="tempVal-${i+1}">-- °C</div></div>
        <div class="lbl">Humedad<div class="val" id="humVal-${i+1}">-- %</div></div>
      </div>
    </div>
  `;
  grid.appendChild(card);

  const pres=document.createElement('div');
  pres.className='presenciaAlert'; pres.id=`pres-${i+1}`;
  card.appendChild(pres);

  card.querySelector(`#toggle-${i+1}`).addEventListener('change',e=>{
    active[i]=e.target.checked;
    card.classList.toggle('inactive',!active[i]);
    updateSummary();
  });

  chartsT[i]=new Chart(document.getElementById(`t-${i+1}`),{
    type:'doughnut',
    data:{datasets:[{data:[0,100],backgroundColor:[tempColor(0),'rgba(0,0,0,0.35)'],borderWidth:0}]},
    options:{rotation:-90,circumference:180,cutout:'72%',plugins:{legend:{display:false}}}
  });

  chartsH[i]=new Chart(document.getElementById(`h-${i+1}`),{
    type:'doughnut',
    data:{datasets:[{data:[0,100],backgroundColor:[humColor(0),'rgba(0,0,0,0.35)'],borderWidth:0}]},
    options:{rotation:-90,circumference:180,cutout:'72%',plugins:{legend:{display:false}}}
  });
}

function updateSummary(){
  let act=0,alerts=0,sumT=0,sumH=0,count=0;
  for(let i=0;i<NUM;i++){
    if(!active[i]) continue;
    act++;
    if(!lastValues[i]) continue;
    sumT+=lastValues[i].t;
    sumH+=lastValues[i].h;
    count++;
    if(lastValues[i].dist>DIST_THRESHOLD_MM) alerts++;
  }
  numActivas.textContent=act;
  numAlertas.textContent=alerts;
  promTemp.textContent=(count?Math.round(sumT/count):'--')+' °C';
  promHum.textContent=(count?Math.round(sumH/count):'--')+' %';
}

for(let i=0;i<NUM;i++) createCard(i);
updateSummary();

firebase.initializeApp({
  authDomain: "enlace-t.firebaseapp.com",
  databaseURL: "https://enlace-t-default-rtdb.firebaseio.com",
  projectId: "enlace-t"
});

const datosPorDia = {};
const LIMITE = 40;

const grafico = new Chart(document.getElementById("graficoMes"),{
  type:"line",
  data:{
    labels:[],
    datasets:[
      {label:"📏 Distancia",data:[],borderWidth:3},
      {label:"🌡 Temp",data:[],borderWidth:1},
      {label:"💧 Hum",data:[],borderWidth:1},
      {label:"🚨 Límite",data:Array(31).fill(LIMITE),borderDash:[5,5]}
    ]
  }
});

firebase.database().ref("prueba").on("value",s=>{
  const d=s.val()||{};
  const estado = estadoConexion(d.FechaHora);

  /* HISTORIAL */
  if(d.FechaHora){
    const dia = parseInt(d.FechaHora.split(" ")[0].split("/")[0]);

    if(!datosPorDia[dia]){
      datosPorDia[dia]={t:[],h:[],dist:[]};
    }

    datosPorDia[dia].t.push(Number(d.Temperatura_C||0));
    datosPorDia[dia].h.push(Number(d.Humedad_pct||0));
    datosPorDia[dia].dist.push(Number(d.Distancia_mm||0));
  }

  const dias=[],t=[],h=[],dist=[];
  for(let i=1;i<=31;i++){
    dias.push(i);
    if(datosPorDia[i]){
      const prom=(arr)=>Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
      t.push(prom(datosPorDia[i].t));
      h.push(prom(datosPorDia[i].h));
      dist.push(prom(datosPorDia[i].dist));
    }else{
      t.push(null);h.push(null);dist.push(null);
    }
  }

  grafico.data.labels=dias;
  grafico.data.datasets[0].data=dist;
  grafico.data.datasets[1].data=t;
  grafico.data.datasets[2].data=h;
  grafico.update();

  /* TU LOGICA ORIGINAL */
  for(let i=0;i<NUM;i++){
    if(!active[i]) continue;

    if(i!==0){
      document.getElementById(`estado-${i+1}`).textContent="🔴 OFFLINE";
      document.getElementById(`wifi-${i+1}`).textContent="📶 --";
      document.getElementById(`tempVal-${i+1}`).textContent="-- °C";
      document.getElementById(`humVal-${i+1}`).textContent="-- %";
      document.getElementById(`dist-${i+1}`).textContent="--";
      document.getElementById(`pres-${i+1}`).textContent="";
      continue;
    }

    const t1=Number(d.Temperatura_C||0);
    const h1=Number(d.Humedad_pct||0);
    const dist1=Number(d.Distancia_mm||0);
    lastValues[i]={t:t1,h:h1,dist:dist1};

    if(dist1 > DIST_THRESHOLD_MM){ badCount[i]++; } else{ badCount[i]=0; }

    const presEl = document.getElementById(`pres-${i+1}`);
    const cardEl = document.getElementById(`card-${i+1}`);

    if(badCount[i]>=3){
      presEl.textContent = "🚨 POSIBLE TERMITA";
      cardEl.classList.add("alert");
    }else{
      presEl.textContent = "";
      cardEl.classList.remove("alert");
    }

    document.getElementById(`tempVal-${i+1}`).textContent=`${t1} °C`;
    document.getElementById(`humVal-${i+1}`).textContent=`${h1} %`;
    document.getElementById(`dist-${i+1}`).textContent=`${Math.round(dist1)} mm`;

    document.getElementById(`estado-${i+1}`).textContent = estado==="ONLINE"?"🟢 ONLINE":"🔴 OFFLINE";
    document.getElementById(`wifi-${i+1}`).textContent = estado==="ONLINE"?"📶 Conectado":"📶 Sin señal";

    const tempMax=50;
    const pct=Math.min((t1/tempMax)*100,100);

    chartsT[i].data.datasets[0].data=[pct,100-pct];
    chartsT[i].data.datasets[0].backgroundColor[0]=tempColor(t1);
    chartsT[i].update();

    chartsH[i].data.datasets[0].data=[h1,100-h1];
    chartsH[i].data.datasets[0].backgroundColor[0]=humColor(h1);
    chartsH[i].update();
  }

  updateSummary();
});
</script>

</body>
</html>
