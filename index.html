<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Panel Sondas T</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#FFFFFF;
  --card:#2ECC0F;
  --text:#FFFFFF;
  --muted:rgba(255,255,255,0.75);
  --accent:#39FF14;
  --danger:#ff3b3b;
  --shadow:0 8px 20px rgba(0,0,0,0.35);
}

html,body{
  margin:0;
  padding:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100%;
}

.app{max-width:1200px;margin:18px auto;padding:14px;}

.header-logo{
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}
.header-logo img{height:150px;}

.header{text-align:center;margin-bottom:16px;}
.title h1{margin:0;font-size:20px;}
.title p{margin:0;color:var(--muted);font-size:13px;}

.summary{
  display:flex;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
  justify-content:center;
}
.metric{
  background:var(--card);
  padding:12px 14px;
  border-radius:10px;
  box-shadow:var(--shadow);
  min-width:140px;
  text-align:center;
}
.metric small{display:block;color:var(--muted);font-size:12px;}
.metric b{display:block;font-size:18px;margin-top:6px;}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:14px;
  box-shadow:var(--shadow);
  border:2px solid transparent;
}

/* 🔥 SOLO MEJORA ALERTA */
.card.alert{
  border-color:#ff0000 !important;
  box-shadow:0 0 15px rgba(255,0,0,0.7);
}

.card.inactive{opacity:.35;filter:grayscale(.1);}

.sonda-title{font-weight:600;font-size:15px;margin-bottom:8px;}
.tog{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:8px;}

.meter-box{
  background:rgba(0,0,0,0.30);
  border-radius:12px;
  padding:8px 6px 6px 6px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.08),
    0 6px 14px rgba(0,0,0,0.45);
  margin:6px 0 8px 0;
}

.charts{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  padding:6px 0;
}

canvas{width:110px!important;height:110px!important;}

.labels{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

.lbl{
  font-size:12px;
  color:rgba(255,255,255,0.85);
  text-align:center;
  min-width:95px;
}

.val{
  font-weight:700;
  font-size:15px;
  color:#ffffff;
}

/* 🔥 SOLO CAMBIO COLOR ALERTA */
.presenciaAlert{
  font-weight:700;
  text-align:center;
  padding:8px 6px;
  margin-top:8px;
  border-radius:8px;
  background:rgba(255,0,0,0.08);
  color:#ff0000;
  min-height:44px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.note{
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}
</style>

</head>

<body>

<div class="app">

  <div class="header-logo">
    <img src="logo.png" alt="IguanaLab">
  </div>

  <div class="header">
    <div class="title">
      <h1>Panel Sondas T</h1>
      <p>Monitoreo: Temperatura · Humedad · Distancia (mm)</p>
    </div>
  </div>

  <div class="summary">
    <div class="metric"><small>Sondas activas</small><b id="numActivas">0</b></div>
    <div class="metric"><small>Alertas distancia</small><b id="numAlertas">0</b></div>
    <div class="metric"><small>Temp. promedio</small><b id="promTemp">-- °C</b></div>
    <div class="metric"><small>Humedad promedio</small><b id="promHum">-- %</b></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="note">Umbral alerta distancia: <b>> 40 mm</b></div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- ===== 🔥 AGREGADO MENU FUNCIONAL ===== -->

<button id="btnMenu" style="position:fixed;top:15px;right:15px;">☰</button>

<div id="menuBox" style="position:fixed;top:60px;right:15px;background:var(--card);padding:10px;border-radius:10px;display:none;">
  <div onclick="abrirSeccion('historial')">📊 Historial sonda</div>
  <div onclick="abrirSeccion('ayuda')">❓ Ayuda</div>
  <div onclick="abrirSeccion('soporte')">📧 Soporte</div>
</div>

<div id="panelMenu" style="position:fixed;top:100px;right:15px;background:var(--card);padding:10px;border-radius:10px;display:none;"></div>

<script>

document.getElementById("btnMenu").onclick = ()=>{
  const m = document.getElementById("menuBox");
  m.style.display = m.style.display==="block"?"none":"block";
};

document.addEventListener("click", function(e){
  const m = document.getElementById("menuBox");
  const p = document.getElementById("panelMenu");
  const b = document.getElementById("btnMenu");

  if(!m.contains(e.target) && !b.contains(e.target) && !p.contains(e.target)){
    m.style.display="none";
    p.style.display="none";
  }
});

function abrirSeccion(tipo){

  const p = document.getElementById("panelMenu");
  p.style.display="block";

  if(tipo==="historial"){
    p.innerHTML='<canvas id="g"></canvas>';

    const labels=[],data=[];

    firebase.database().ref("historial").once("value",snap=>{
      snap.forEach(c=>{
        const d=c.val();
        labels.push(d.FechaHora.split(" ")[1]);
        data.push(Number(d.Distancia_mm||0));
      });

      new Chart(document.getElementById("g"),{
        type:"bar",
        data:{labels:labels,datasets:[{label:"mm",data:data}]}
      });
    });
  }

  if(tipo==="ayuda"){
    p.innerHTML='Sonda monitorea subsuelo para detectar termitas mediante cambios en distancia (VLX), humedad y temperatura.';
  }

  if(tipo==="soporte"){
    const c=localStorage.getItem("correo")||"correo@editar.cl";
    p.innerHTML='<input id="c" value="'+c+'"><button onclick="guardar()">Guardar</button>';
  }
}

function guardar(){
  localStorage.setItem("correo",document.getElementById("c").value);
  alert("Guardado");
}

</script>

</body>
</html>
