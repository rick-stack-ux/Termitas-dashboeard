<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Panel Sondas T</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#FFFFFF;
  --card:#2ECC0F;
  --text:#FFFFFF;
  --muted:rgba(255,255,255,0.75);
  --accent:#39FF14;
  --danger:#ff3b3b;
  --shadow:0 8px 20px rgba(0,0,0,0.35);
}

html,body{
  margin:0;
  padding:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100%;
}

.app{max-width:1200px;margin:18px auto;padding:14px;}

.header-logo{
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}
.header-logo img{height:150px;}

.header{text-align:center;margin-bottom:16px;}
.title h1{margin:0;font-size:20px;}
.title p{margin:0;color:var(--muted);font-size:13px;}

.summary{
  display:flex;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
  justify-content:center;
}
.metric{
  background:var(--card);
  padding:12px 14px;
  border-radius:10px;
  box-shadow:var(--shadow);
  min-width:140px;
  text-align:center;
}
.metric small{display:block;color:var(--muted);font-size:12px;}
.metric b{display:block;font-size:18px;margin-top:6px;}

.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:16px;
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:14px;
  box-shadow:var(--shadow);
  border:2px solid transparent;
}

.card.alert{
  border-color:#ff0000 !important;
  box-shadow:0 0 15px rgba(255,0,0,0.7);
}

.card.inactive{opacity:.35;filter:grayscale(.1);}

.sonda-title{font-weight:600;font-size:15px;margin-bottom:8px;}
.tog{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:8px;}

.meter-box{
  background:#000020;
  border-radius:12px;
  padding:8px 6px 6px 6px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.08),
    0 6px 14px rgba(0,0,0,0.45);
  margin:6px 0 8px 0;
}

.charts{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  padding:6px 0;
}

.charts canvas { width:110px !important; height:110px !important; }

.labels{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

.lbl{
  font-size:12px;
  color:rgba(255,255,255,0.85);
  text-align:center;
  min-width:95px;
}

.val{
  font-weight:700;
  font-size:15px;
  color:#ffffff;
}

.presenciaAlert{
  font-weight:700;
  text-align:center;
  padding:8px 6px;
  margin-top:8px;
  border-radius:8px;
  background:rgba(255,0,0,0.08);
  color:#ff0000;
  min-height:44px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.note{
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
  text-align:center;
}
</style>

</head>

<body>
<div class="app">

  <div class="header-logo">
    <img src="logo.png" alt="IguanaLab" onerror="this.style.display='none'">
  </div>

  <div class="header">
    <div class="title">
      <h1>Panel Sondas T</h1>
      <p>Monitoreo: Temperatura · Humedad · Distancia (mm)</p>
    </div>
  </div>

  <div class="summary">
    <div class="metric"><small>Sondas activas</small><b id="numActivas">0</b></div>
    <div class="metric"><small>Alertas distancia</small><b id="numAlertas">0</b></div>
    <div class="metric"><small>Temp. promedio</small><b id="promTemp">-- °C</b></div>
    <div class="metric"><small>Humedad promedio</small><b id="promHum">-- %</b></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="note">Umbral alerta distancia: <b>> 40 mm</b></div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
function estadoConexion(fechaStr){
  if(!fechaStr) return "OFFLINE";
  const p = fechaStr.split(" ");
  if(p.length < 2) return "OFFLINE";
  const f = p[0].split("/");
  const h = p[1].split(":");
  const fechaDato = new Date(f[2], f[1]-1, f[0], h[0], h[1], h[2]);
  const ahora = new Date();
  const diffMin = (ahora - fechaDato)/60000;
  return diffMin <= 780 ? "ONLINE" : "OFFLINE";
}

const NUM = 5, DIST_THRESHOLD_MM = 40;
const chartsT = [], chartsH = [], active = [true,false,false,false,false],
      lastValues = Array(NUM).fill(null), badCount = Array(NUM).fill(0);

function tempColor(v){
  return v <= 22 ? 'rgba(46,204,113,0.85)' :
         v <= 28 ? 'rgba(241,196,15,0.85)' :
         'rgba(231,76,60,0.9)';
}

function humColor(v){
  return v <= 30 ? 'rgba(52,152,219,0.85)' :
         v <= 60 ? 'rgba(41,128,185,0.9)' :
         'rgba(31,97,141,0.95)';
}

function createCard(i){
  const grid=document.getElementById('grid');
  const card=document.createElement('div');
  card.className='card'; card.id=`card-${i+1}`;
  if(!active[i]) card.classList.add('inactive');

  card.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div class="sonda-title">Sonda ${i+1}</div>
      <div style="text-align:right;font-size:12px;">
        <div id="estado-${i+1}">🔴 OFFLINE</div>
        <div id="wifi-${i+1}">📶 --</div>
      </div>
    </div>

    <div class="tog">
      <label><input type="checkbox" id="toggle-${i+1}" ${active[i]?'checked':''}> Activar</label>
      <div style="flex:1"></div>
      <div style="font-size:12px;color:var(--muted)">Dist: <span id="dist-${i+1}">--</span></div>
    </div>

    <div class="meter-box">
      <div class="charts">
        <canvas id="t-${i+1}"></canvas>
        <canvas id="h-${i+1}"></canvas>
      </div>
      <div class="labels">
        <div class="lbl">Temperatura<div class="val" id="tempVal-${i+1}">-- °C</div></div>
        <div class="lbl">Humedad<div class="val" id="humVal-${i+1}">-- %</div></div>
      </div>
    </div>
  `;
  grid.appendChild(card);

  const pres=document.createElement('div');
  pres.className='presenciaAlert'; pres.id=`pres-${i+1}`;
  card.appendChild(pres);

  card.querySelector(`#toggle-${i+1}`).addEventListener('change',e=>{
    active[i]=e.target.checked;
    card.classList.toggle('inactive',!active[i]);
    updateSummary();
  });

  chartsT[i]=new Chart(document.getElementById(`t-${i+1}`),{
    type:'doughnut',
    data:{datasets:[{data:[0,100],backgroundColor:[tempColor(0),'rgba(0,0,0,0.35)'],borderWidth:0}]},
    options:{rotation:-90,circumference:180,cutout:'72%',plugins:{legend:{display:false}}}
  });

  chartsH[i]=new Chart(document.getElementById(`h-${i+1}`),{
    type:'doughnut',
    data:{datasets:[{data:[0,100],backgroundColor:[humColor(0),'rgba(0,0,0,0.35)'],borderWidth:0}]},
    options:{rotation:-90,circumference:180,cutout:'72%',plugins:{legend:{display:false}}}
  });
}

function updateSummary(){
  let act=0,alerts=0,sumT=0,sumH=0,count=0;
  for(let i=0;i<NUM;i++){
    if(!active[i]) continue;
    act++;
    if(!lastValues[i]) continue;
    sumT+=lastValues[i].t;
    sumH+=lastValues[i].h;
    count++;
    if(lastValues[i].dist>DIST_THRESHOLD_MM) alerts++;
  }
  numActivas.textContent=act;
  numAlertas.textContent=alerts;
  promTemp.textContent=(count?Math.round(sumT/count):'--')+' °C';
  promHum.textContent=(count?Math.round(sumH/count):'--')+' %';
}

for(let i=0;i<NUM;i++) createCard(i);
updateSummary();

firebase.initializeApp({
  authDomain: "enlace-t.firebaseapp.com",
  databaseURL: "https://enlace-t-default-rtdb.firebaseio.com",
  projectId: "enlace-t"
});

for(let i=0; i<NUM; i++){
  let sondaId = i + 1;
  let nodoFirebase = (sondaId === 1) ? "prueba" : `prueba${sondaId}`;

  firebase.database().ref(nodoFirebase).on("value", s => {
    const d = s.val();
    if(!d) return; 

    if(!active[i]) return;

    const estado = estadoConexion(d.FechaHora);
    const t = Number(d.Temperatura_C||0);
    const h = Number(d.Humedad_pct||0);
    const dist = Number(d.Distancia_mm||0);
    lastValues[i] = {t,h,dist};

    if(dist > DIST_THRESHOLD_MM){ badCount[i]++; }
    else { badCount[i]=0; }

    const presEl = document.getElementById(`pres-${sondaId}`);
    const cardEl = document.getElementById(`card-${sondaId}`);

    if(badCount[i]>=3){
      presEl.textContent = "🚨 POSIBLE TERMITA";
      cardEl.classList.add("alert");
    }else{
      presEl.textContent = "";
      cardEl.classList.remove("alert");
    }

    document.getElementById(`tempVal-${sondaId}`).textContent=`${t} °C`;
    document.getElementById(`humVal-${sondaId}`).textContent=`${h} %`;
    document.getElementById(`dist-${sondaId}`).textContent=`${Math.round(dist)} mm`;

    document.getElementById(`estado-${sondaId}`).textContent = estado==="ONLINE"?"🟢 ONLINE":"🔴 OFFLINE";
    document.getElementById(`wifi-${sondaId}`).textContent = estado==="ONLINE"?"📶 Conectado":"📶 Sin señal";

    const tempMax=50;
    const pct=Math.min((t/tempMax)*100,100);

    chartsT[i].data.datasets[0].data=[pct,100-pct];
    chartsT[i].data.datasets[0].backgroundColor[0]=tempColor(t);
    chartsT[i].update();

    chartsH[i].data.datasets[0].data=[h,100-h];
    chartsH[i].data.datasets[0].backgroundColor[0]=humColor(h);
    chartsH[i].update();

    updateSummary();
  });
}
</script>

<!-- ===== MODAL HISTORIAL REDISEÑADA ===== -->

<style>
.btn-pro{position:fixed;top:15px;right:15px;background:var(--card);border:none;border-radius:10px;padding:8px;cursor:pointer;z-index:9999;box-shadow:var(--shadow);}
.btn-pro span{display:block;width:22px;height:3px;background:#fff;margin:4px 0;}
.menu-pro{position:fixed;top:60px;right:15px;width:240px;background:#111827;color:#fff;border-radius:12px;padding:8px;display:none;z-index:9999;box-shadow:var(--shadow);}
.menu-pro.active{display:block;}
.menu-pro div{padding:12px;cursor:pointer;font-size:14px;border-bottom:1px solid rgba(255,255,255,0.05);}
.menu-pro div:last-child{border-bottom:none;}
.menu-pro div:hover{background:rgba(255,255,255,0.1);border-radius:6px;}

.modal-overlay {
  position:fixed; top:0; left:0; width:100vw; height:100vh;
  background:rgba(0,0,0,0.6); backdrop-filter:blur(3px);
  display:none; z-index:9998;
}
.modal-overlay.active { display:block; }

.panel-pro{
  position:fixed; top:50%; left:50%; transform:translate(-50%, -50%);
  width:95vw; max-width:980px; background:#ffffff; border-radius:12px;
  display:none; z-index:9999; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);
  color:#1e293b; overflow:hidden;
}
.panel-pro.active{display:block;}

.modal-header { padding:20px 24px 0 24px; display:flex; justify-content:space-between; align-items:center; }
.modal-header h3 { margin:0; font-size:18px; font-weight:700; color:#0f172a; }
.btn-close { background:none; border:none; font-size:24px; color:#94a3b8; cursor:pointer; line-height:1; }
.btn-close:hover { color:#0f172a; }

.tabs { display:flex; gap:15px; border:none; padding:0; background:#fff; margin:0;}
.tab-btn { background:none; border:none; padding:12px 10px; font-weight:600; color:#64748b; cursor:pointer; border-bottom:3px solid transparent; font-size:14px; outline:none; }
.tab-btn:hover { color:#0f172a; }
.tab-btn.active { color:#10b981; border-bottom-color:#10b981; }

.chart-card-container { display:flex; background:#fff; }
.chart-left { flex:1; padding:20px 24px 30px 24px; border-right:1px solid #f1f5f9; min-width:0; }
.chart-wrapper { position:relative; height:260px; width:100%; }
.chart-right { width:220px; padding:30px 24px; display:flex; flex-direction:column; justify-content:center; }

.filtros-top { display:flex; justify-content:space-between; align-items:center; padding:10px 24px 0 24px; border-bottom:1px solid #f1f5f9; }
.select-rango { padding:6px 12px; border-radius:6px; border:1px solid #cbd5e1; font-family:inherit; font-size:13px; color:#334155; outline:none; cursor:pointer; background:#fff; }

@media (max-width: 768px) {
  .chart-card-container { flex-direction:column; }
  .chart-left { border-right:none; border-bottom:1px solid #f1f5f9; }
  .chart-right { width:100%; align-items:center; text-align:center; padding:20px; }
  .filtros-top { flex-direction:column; align-items:flex-start; gap:10px; padding-bottom:10px;}
  .tabs { overflow-x:auto; width:100%;}
  .tab-btn { white-space:nowrap; }
}
</style>

<button class="btn-pro" id="btnMenuPro">
  <span></span><span></span><span></span>
</button>

<div id="menuPro" class="menu-pro">
  <div onclick="abrirMenuPro()">📊 Ver Historial de Cebo</div>
  <div onclick="descargarCSVGlobal()">⬇ Descargar Datos CSV (Todas)</div>
</div>

<div id="overlayPro" class="modal-overlay"></div>
<div id="panelPro" class="panel-pro">
  <div class="modal-header">
    <h3>Análisis de Sondas</h3>
    <button class="btn-close" onclick="cerrarModal()">×</button>
  </div>
  
  <div class="filtros-top">
    <div class="tabs" id="tabContainer">
      <button class="tab-btn active" onclick="cargarGraficoSonda(1, this)">Sonda 1</button>
      <button class="tab-btn" onclick="cargarGraficoSonda(2, this)">Sonda 2</button>
      <button class="tab-btn" onclick="cargarGraficoSonda(3, this)">Sonda 3</button>
      <button class="tab-btn" onclick="cargarGraficoSonda(4, this)">Sonda 4</button>
      <button class="tab-btn" onclick="cargarGraficoSonda(5, this)">Sonda 5</button>
    </div>
    
    <!-- Filtro de tiempo -->
    <select id="rangoTiempo" class="select-rango" onchange="cargarGraficoSonda(activeSondaTab)">
      <option value="7">Últimos 7 días</option>
      <option value="30">Último mes</option>
      <option value="all">Histórico completo</option>
    </select>
  </div>

  <div class="chart-card-container">
    <div class="chart-left">
      <div class="chart-wrapper">
        <canvas id="graficoHistorial" style="width: 100% !important; height: 100% !important;"></canvas>
      </div>
    </div>
    <div class="chart-right">
      <div style="display:flex; align-items:baseline; gap:6px;">
        <h1 id="distanciaActual" style="margin:0; font-size:42px; font-weight:800; color:#0f172a; letter-spacing:-1px;">--</h1>
        <span style="font-size:14px; font-weight:700; color:#334155;">mm</span>
      </div>
      <p style="margin:4px 0 8px 0; color:#64748b; font-size:13px;">Distancia Actual</p>
      <p id="porcentajeCebo" style="margin:0; font-size:13px; font-weight:700; color:#10b981;">--</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

<script>
let activeSondaTab = 1;
let miGraficoHistorial = null;

btnMenuPro.onclick = () => menuPro.classList.toggle("active");

function cerrarModal() {
  document.getElementById('overlayPro').classList.remove('active');
  document.getElementById('panelPro').classList.remove('active');
}

document.getElementById('overlayPro').addEventListener('click', cerrarModal);

document.addEventListener("click",(e)=>{
  if(!menuPro.contains(e.target) && !btnMenuPro.contains(e.target)){
    menuPro.classList.remove("active");
  }
});

function parseFechaCL(fechaStr) {
  if(!fechaStr) return new Date();
  const p = fechaStr.split(" ");
  if(p.length < 2) return new Date();
  const f = p[0].split("/");
  const h = p[1].split(":");
  return new Date(f[2], f[1]-1, f[0], h[0], h[1], h[2]);
}

function abrirMenuPro(){
  menuPro.classList.remove("active");
  document.getElementById('overlayPro').classList.add('active');
  document.getElementById('panelPro').classList.add("active");
  
  cargarGraficoSonda(1, document.querySelector('.tab-btn'));
}

function cargarGraficoSonda(sondaId, btnElement = null) {
  activeSondaTab = sondaId;
  
  if(btnElement) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');
  }

  document.getElementById('distanciaActual').textContent = "--";
  document.getElementById('porcentajeCebo').textContent = "Cargando...";
  document.getElementById('porcentajeCebo').style.color = "#64748b";

  let nodoHistorial = (sondaId === 1) ? "historial" : `historial${sondaId}`;
  const filtroDias = document.getElementById('rangoTiempo').value;

  firebase.database().ref(nodoHistorial).once("value", snap => {
    let records = [];
    snap.forEach(c => {
      const d = c.val();
      if(d.FechaHora) {
        records.push({
          time: parseFechaCL(d.FechaHora),
          // Cambiado a DD/MM (Días)
          label: d.FechaHora.split(" ")[0].substring(0,5), 
          val: Number(d.Distancia_mm||0)
        });
      }
    });

    // Ordenar de más antiguo a más nuevo
    records.sort((a,b) => a.time - b.time);

    // Aplicar Filtro de Tiempo
    const ahora = new Date();
    if (filtroDias !== 'all') {
      const msLimite = parseInt(filtroDias) * 24 * 60 * 60 * 1000;
      records = records.filter(r => (ahora - r.time) <= msLimite);
    }

    const labels = records.map(r => r.label);
    const data = records.map(r => r.val);

    if (records.length > 0) {
      const currentVal = records[records.length - 1].val;
      const baselineVal = records[0].val; // Se compara vs el inicio del periodo filtrado
      
      let diferencia = currentVal - baselineVal;
      let porcentaje = baselineVal === 0 ? 0 : (diferencia / baselineVal) * 100;
      
      let colorText = diferencia >= 0 ? "#10b981" : "#ef4444";
      let arrow = diferencia >= 0 ? "▲" : "▼";
      
      document.getElementById('distanciaActual').textContent = currentVal.toFixed(1);
      document.getElementById('porcentajeCebo').textContent = `${arrow} ${Math.abs(porcentaje).toFixed(1)}% vs inicio`;
      document.getElementById('porcentajeCebo').style.color = colorText;
    } else {
      document.getElementById('distanciaActual').textContent = "0";
      document.getElementById('porcentajeCebo').textContent = "Sin datos en el periodo";
      document.getElementById('porcentajeCebo').style.color = "#64748b";
    }

    if (miGraficoHistorial) {
      miGraficoHistorial.destroy();
    }

    const ctx = document.getElementById('graficoHistorial').getContext('2d');
    let gradiente = ctx.createLinearGradient(0, 0, 0, 260);
    gradiente.addColorStop(0, 'rgba(16, 185, 129, 0.18)');
    gradiente.addColorStop(1, 'rgba(16, 185, 129, 0)');

    miGraficoHistorial = new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [{
          data: data,
          borderColor: "#10b981",
          backgroundColor: gradiente,
          borderWidth: 2,
          tension: 0.4,
          fill: true,
          pointBackgroundColor: '#ffffff',
          pointBorderColor: '#10b981',
          pointBorderWidth: 2,
          pointRadius: 4,
          pointHoverRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1e293b',
            titleFont: { size: 13 },
            bodyFont: { size: 14, weight: 'bold' },
            displayColors: false
          }
        },
        scales: {
          x: { 
            grid: { color: '#f1f5f9', drawBorder: false },
            ticks: { color: '#64748b', font: { size: 11 }, maxTicksLimit: 7 } 
          },
          y: { 
            min: 0,
            max: 40, // 🔥 Límite estricto de 40mm (4 cm)
            grid: { color: '#f1f5f9', drawBorder: false },
            ticks: { color: '#64748b', font: { size: 11 } } 
          }
        }
      }
    });
  });
}

// 🔥 Exportación Consolidada: Descarga las 5 Sondas en un solo archivo
function descargarCSVGlobal(){
  const promesas = [];
  
  for(let i=1; i<=5; i++){
    let nodo = (i===1) ? "historial" : `historial${i}`;
    promesas.push(firebase.database().ref(nodo).once("value").then(snap => {
      return { sonda: i, data: snap.val() };
    }));
  }

  Promise.all(promesas).then(resultados => {
    // Agregamos \uFEFF al inicio para que Excel lea correctamente el formato
    let csv = "\uFEFFSonda,FechaHora,Distancia_mm\n";
    
    resultados.forEach(res => {
      if(res.data){
        Object.values(res.data).forEach(d => {
          if(d.FechaHora) {
            csv += `Sonda ${res.sonda},${d.FechaHora},${d.Distancia_mm}\n`;
          }
        });
      }
    });

    const blob = new Blob([csv], {type: "text/csv;charset=utf-8;"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "comportamiento_todas_las_sondas.csv";
    a.click();
    menuPro.classList.remove("active");
  });
}
</script>

</body>
</html>
